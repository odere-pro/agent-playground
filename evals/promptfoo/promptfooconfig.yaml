# promptfoo on the PoC-7 golden set, through the chassis's `POST /v1/run` (a black box over HTTP).
# Nothing here names an engine: the launcher sets the variables per engine.
#   CHASSIS_URL  the chassis under test, for example http://127.0.0.1:8080
#   JUDGE_URL    the OpenAI-compatible judge, ends in /v1 (the fake model server in the trial)
#   EVAL_ENGINE  a label only
# Run: uv run python -m bakeoff.evaltrial --tool promptfoo --engine echo-python --out DIR
description: "PoC-7 golden set via /v1/run ({{ env.EVAL_ENGINE }})"
prompts:
  - "{{input}}"
providers:
  - id: http
    label: chassis
    config:
      url: "{{ env.CHASSIS_URL }}/v1/run"
      method: POST
      headers:
        Content-Type: application/json
      body:
        input:
          text: "{{prompt}}"
        stream: false
      # Response envelope: output.text, output.tool_calls, trace_id, status (contract-v0.md).
      transformResponse: file://transform.js
defaultTest:
  options:
    provider:
      id: openai:chat:fake-judge
      config:
        apiBaseUrl: "{{ env.JUDGE_URL }}"
        apiKey: not-a-key  # pragma: allowlist secret
        temperature: 0
tests: file://tests.yaml
evaluateOptions:
  maxConcurrency: 1
