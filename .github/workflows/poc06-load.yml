# PoC-6a criterion 4, the load half: the PoC-4 load matrix on the Compose scale stack for the new
# sidecar engines, echo-openai-agents and echo-typescript (the full agent of PoC-6a). The other
# sidecar engines have PoC-4's quiet pass (pocs/poc-04-stateless-scalable/notes/load/results.json).
#
# What it runs: `deploy/compose/scale.sh build`, then `load_tools.run_matrix` (`make load-test`,
# packages/load-tools) with the `main` scenarios (64 users at 1, 2, and 4 pairs) and the `rate`
# scenario (10 users at 1 call per second, 1 pair) for each engine, on the fake model server.
# Then a check fails the job when a
# scenario is missing, sent no request, or failed more than 0.1% of its calls (suggested: about
# three times the worst scenario of PoC-4's accepted quiet pass, 4 of 11,596; the same bar as
# tests/test_poc06a_criteria.py). The results JSON is printed between markers, so it can be
# recorded in pocs/poc-06a-bake-off-sidecar-lane/notes/ (the first record:
# notes/2026-10-28-sidecar-load-in-ci.md).
#
# Trigger: workflow_dispatch only, since 2026-11-08: a finished PoC is checked locally, not on every
# push and pull request (docs/guides/testing.md, "What CI runs"). Never pull_request_target.
# The inputs pick the engines and the scenario kinds (122 X-5, 2026-11-08: one dispatch per engine
# pair runs the whole matrix on Linux runners in parallel; `hop` adds the echo-python sidecar
# against inprocess hop). The defaults are the PoC-6a run above.
# A shared GitHub runner is noisy: the numbers show the engines pass the load
# suite; growth with pairs is recorded, not asserted (4 pairs do not fit a 4-CPU runner).
#
# No secret is used: scale.sh generates the stack's passwords into .env.poc04 (mode 600) and never
# prints them; `down` deletes the file. Every action is pinned by a full commit SHA, the same as
# ci.yml.
name: poc06-load

on:
  workflow_dispatch:
    inputs:
      engines:
        description: "Engines, comma-separated (echo-python, echo-pydanticai, echo-langgraph, echo-openai-agents, echo-typescript)"
        type: string
        default: "echo-openai-agents,echo-typescript"
      only:
        description: "Scenario kinds, comma-separated (main, rate, hop, idem)"
        type: string
        default: "main,rate"

permissions:
  contents: read

jobs:
  poc06-load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The inputs reach the shell through env only, never by expression inside a script.
      ENGINES: ${{ inputs.engines || 'echo-openai-agents,echo-typescript' }}
      ONLY: ${{ inputs.only || 'main,rate' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # PR code runs `scale.sh`: it gets no stored token.
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          # The version ci.yml and the Dockerfiles pin (ghcr.io/astral-sh/uv:0.11.23).
          version: "0.11.23"
          # No uv cache on pull_request: PR code cannot poison what a push run restores.
          enable-cache: ${{ github.event_name != 'pull_request' }}
      - name: Sync
        run: uv sync --all-packages --locked
      - name: Host
        run: |
          nproc
          free -m
          docker version --format '{{.Server.Version}}'
          docker compose version
      - name: Build the scale stack images
        run: deploy/compose/scale.sh build
      - name: Load matrix
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra engines <<<"$ENGINES"
          for e in "${engines[@]}"; do
            [[ $e =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad engine '$e'"; exit 1; }
            args+=(--engine "$e")
          done
          IFS=',' read -ra kinds <<<"$ONLY"
          for k in "${kinds[@]}"; do
            [[ $k =~ ^[a-z]+$ ]] || { echo "::error::bad scenario kind '$k'"; exit 1; }
            args+=(--only "$k")
          done
          uv run python -m load_tools.run_matrix "${args[@]}" \
            --results "$RUNNER_TEMP/poc06-load.json"
      - name: Check every scenario ran, with at most 0.1% failed calls
        run: |
          uv run python - <<'EOF'
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "poc06-load.json")))
          engines = [e for e in os.environ["ENGINES"].split(",") if e]
          kinds = {k for k in os.environ["ONLY"].split(",") if k}
          runs = []
          if "main" in kinds:
              runs += [(f"{e} {p}p", d.get("engines", {}).get(e, {}).get(p)) for e in engines for p in ("1", "2", "4")]
          if "rate" in kinds:
              runs += [(f"{e} rate10", d.get("rate", {}).get(e)) for e in engines]
          if "hop" in kinds and "echo-python" in engines:
              runs += [(f"hop {lane}", d.get("hop", {}).get(lane)) for lane in ("sidecar", "inprocess")]
              print(f"hop sidecar minus inprocess: {d.get('hop', {}).get('hop_ms')}")
          bad = []
          for name, r in runs:
              if r is None:
                  bad.append(f"{name}: missing")
                  continue
              print(f"{name}: {r['requests']} requests, {r['failures']} failures, {r['rps']} rps, p50 {r['p50_ms']} ms, p95 {r['p95_ms']} ms")
              if r["requests"] == 0 or r["failures"] / r["requests"] > 0.001:
                  bad.append(f"{name}: {r['failures']}/{r['requests']} failed")
          if bad:
              print("::error::" + "; ".join(bad))
              sys.exit(1)
          print("every scenario ok")
          EOF
      - name: Results JSON
        if: always()
        run: |
          echo "=== poc06-load results begin ==="
          cat "$RUNNER_TEMP/poc06-load.json" 2>/dev/null || echo "(no results file)"
          echo "=== poc06-load results end ==="
      - name: Down
        if: always()
        run: deploy/compose/scale.sh down
