name: poc08-evals

# PoC-8: the offline eval gate and the red-team set, on every engine that runs offline, in every
# lane it may use (the trust rule: untrusted engines run remote only). One job, one setup, three
# steps (the gate, the regression, the red-team set), with a log group per engine; a failure names
# its engine in an error line and the job summary. (Until 2026-11-08 it was 15 jobs, one per engine
# and suite, of under a minute each: mostly repeated runner setup.) The same steps run locally: `make evals`, `make evals-regression`,
# `make redteam`.
#
# - evals: DeepEval 4.3.2 on the 50 gate cases (`eval_kit.evalrun`), then the gate against the
#   committed baseline `evals/gate/baseline.json` (`eval_kit.evalgate`). The gate exits 1 when the
#   pass rate drops below the baseline, a must-pass case fails, or a must-fail case (a wrong answer
#   on purpose) starts to pass. A failing case on its own is not a job failure; the gate decides.
# - regression: the planning doc's demo. The `drop-facts` business logic (every answer loses a
#   fact) must make the gate exit 1; the step fails if the gate passes it or errors.
# - redteam: the PoC-7 red-team set (`eval_kit.redteam`) on both guardrail stacks, checked against
#   `evals/redteam/baseline.json`: exit 1 when a block rate drops or a stopped case gets through.
#
# The engines' model and the judge are the scripted fake model server on localhost: no secret, no
# hosted model, no egress beyond package installs. DeepEval telemetry is off (set by the launcher).
# kagent-adk runs only on kind (poc06-kind.yml) and is skipped here, as the baselines record.
# Every action is pinned by a full commit SHA. Never pull_request_target.
#
# Trigger, since 2026-11-08: pull_request and push to main, on what the gate is made of (the paths
# below: the golden and baseline files, eval-kit, the engines, the chassis source, the fake servers),
# and workflow_dispatch. Evals run on a business logic, prompt, or model change
# (docs/guides/testing.md); a chassis test or a docs change does not run them.

on:
  pull_request:
    paths: &eval-paths
      - "evals/**"
      - "packages/bakeoff/**"
      - "packages/chassis/pyproject.toml"
      - "packages/chassis/src/**"
      - "packages/contract-suites/src/**"
      - "packages/eval-kit/**"
      - "packages/fake-mcp-server/**"
      - "packages/fake-model-server/**"
      - "packages/guardrail-server/**"
      - "packages/workload-a2a/**"
      - "packages/workloads/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/poc08-evals.yml"
  push:
    branches: [main]
    paths: *eval-paths
  workflow_dispatch:

permissions:
  contents: read

env:
  # ADR-006's supported engines that run offline; test_poc08_c1_ci.py checks this list.
  ENGINES: >-
    echo-python echo-pydanticai echo-langgraph echo-openai-agents echo-typescript
    echo-smolagents echo-claude-agent

concurrency:
  group: poc08-evals-${{ github.ref }}
  # A newer PR push cancels the old run; on main every merge keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.11.23"
          enable-cache: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Build echo-typescript
        working-directory: packages/workloads/echo-typescript
        run: npm ci && npm run build
      - name: Sync
        run: uv sync --all-packages --locked
      - name: Golden files in sync
        run: uv run python -m eval_kit.golden.generate --check
      # Per engine: DeepEval on the gate set in every lane, then the gate against the baseline.
      # evalrun exits 1 only when a stack does not start or DeepEval writes no report; the gate
      # decides pass or fail. Every engine runs, then the job fails naming each failed one.
      - name: Eval gate, every engine and lane
        run: |
          set -uo pipefail
          failed=()
          for engine in $ENGINES; do
            echo "::group::$engine"
            if uv run python -m eval_kit.evalrun --engine "$engine" --out eval-reports &&
              uv run python -m eval_kit.evalgate --report eval-reports --engine "$engine"; then
              echo "$engine: ok"
            else
              echo "::error::$engine: the eval gate failed"; failed+=("$engine")
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "eval gate failed: ${failed[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "eval gate: every engine ok" >> "$GITHUB_STEP_SUMMARY"
      - name: Business logic that drops facts fails the eval gate
        # Runs when the gate step failed too, so one run shows all three results.
        if: ${{ !cancelled() }}
        run: make evals-regression EVAL_OUT=eval-reports/drop-facts
      # Per engine: the red-team set in every lane, on both guardrail stacks, against the baseline.
      - name: Red-team set, every engine and lane, both guardrail stacks
        # Runs when the gate step failed too, so one run shows all three results.
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=()
          for engine in $ENGINES; do
            echo "::group::$engine"
            if uv run python -m eval_kit.redteam --engine "$engine" --out "redteam/$engine.json"; then
              echo "$engine: ok"
            else
              echo "::error::$engine: the red-team check failed"; failed+=("$engine")
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "red-team failed: ${failed[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "red-team: every engine ok" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: poc08-eval-reports
          path: eval-reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: poc08-redteam
          path: redteam/
          if-no-files-found: warn
