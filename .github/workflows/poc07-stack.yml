# PoC-7 real-service run (plan docs/plans/2026-10-28-poc-07-cross-cutting.md, exit criteria 1
# and 2).
#
# What it runs: `deploy/compose/poc07/stack.sh up` (Langfuse v4 web and worker, ClickHouse,
# MinIO, Redis, Postgres, Jaeger 2.21.0, the OTel Collector), `stack.sh wait` (host-side polls of
# Langfuse, Jaeger, and the Collector), `stack.sh digests` (image digests into the log, to pin
# them in docker-compose.yaml), then the `network` tests of
# pocs/poc-07-cross-cutting-decisions/tests/test_poc07_stack.py: the same spans in Langfuse and
# Jaeger through the Collector, then straight to Langfuse with only the exporter config changed;
# `LangfuseFeedback` against the real Langfuse; and a chassis call whose feedback lands on its
# trace.
#
# Trigger: push, pull_request, and workflow_dispatch. Never pull_request_target.
# No secret is used: stack.sh makes every credential into an env file (mode 600) on the runner.
# The tests get its path from `stack.sh env` and read it themselves; nothing here prints it. On
# failure, log tails go through `stack.sh logs`, which masks every env file value.
# The offline gate (`make check`, ci.yml) stays the every-commit gate. Every action is pinned by
# a full commit SHA, the same as ci.yml.
name: poc07-stack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc07-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # PR code runs `stack.sh up`: it gets no stored token.
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.11.23"
          # No uv cache on pull_request: PR code cannot poison what a push run restores.
          enable-cache: ${{ github.event_name != 'pull_request' }}
      - name: Sync
        run: uv sync --all-packages --locked
      - name: Up
        run: deploy/compose/poc07/stack.sh up
      - name: Wait
        run: deploy/compose/poc07/stack.sh wait
      - name: Digests
        run: deploy/compose/poc07/stack.sh digests
      - name: PoC-7 stack tests
        run: |
          set -euo pipefail
          # `stack.sh env` prints POC07_ENV_FILE=<path>: the path, never the values.
          export "$(deploy/compose/poc07/stack.sh env)"
          POC07_STACK=1 uv run pytest -m network -v \
            pocs/poc-07-cross-cutting-decisions/tests/test_poc07_stack.py
      - name: Logs
        if: failure()
        run: |
          set -uo pipefail
          deploy/compose/poc07/stack.sh logs
          echo "(stack.sh logs: every env file value is redacted)"
      - name: Down
        if: always()
        run: deploy/compose/poc07/stack.sh down
