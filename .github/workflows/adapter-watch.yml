name: adapter-watch

# ADR-006 decision 1: the LangGraph workload's MCP client is a stand-in until
# `langchain-mcp-adapters` works with `mcp` 2. Its watch test is a strict xfail in
# packages/workloads/echo-langgraph/tests/test_langgraph_handle.py. This job moves the adapter to
# its newest release that resolves with the locked `mcp`, then runs that one test. Red means a
# release works with `mcp` 2: do the swap. It is the backup to the weekly Dependabot uv bump, it
# commits nothing, and it is never a required check.
on:
  schedule:
    - cron: "17 6 * * 1" # suggested: Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Move the adapter to its newest release
        run: uv lock --upgrade-package langchain-mcp-adapters
      - name: Sync
        run: uv sync --all-packages
      - name: Run the watch test
        run: >-
          uv run pytest -p no:cacheprovider -rxX
          "packages/workloads/echo-langgraph/tests/test_langgraph_handle.py::test_langchain_mcp_adapters_loads_the_chassis_tools_on_mcp_2"
