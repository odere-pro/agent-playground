name: poc07-evals

# PoC-7 exit criterion 8: the picked eval tool (DeepEval 4.3.2) on the 20 golden cases, for two
# engines in the sidecar lane, through the chassis's /v1/run. The engines' model and the judge are
# the scripted fake model server: no secret, no hosted model, no egress beyond package installs.
# Telemetry is off (DEEPEVAL_TELEMETRY_OPT_OUT=1, set by the launcher). The launcher installs
# DeepEval from evals/deepeval/requirements.txt (`--require-hashes --no-deps`), never by name
# (R7-18). The reports (eval-report.v0 and DeepEval's own JSON) are uploaded as artifacts.
# Local: uv run python -m eval_kit.evaltrial --tool deepeval --out /tmp/evals
#
# Trigger: workflow_dispatch only, since 2026-11-08: a finished PoC is checked locally, not on every
# push and pull request (docs/guides/testing.md, "What CI runs"). Never pull_request_target.
# The eval gate that blocks a regression is poc08-evals.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poc07-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.11.23"
          # No uv cache on pull_request: PR code cannot poison what a push run restores.
          enable-cache: ${{ github.event_name != 'pull_request' }}
      - name: Sync
        run: uv sync --all-packages --locked
      - name: Golden files in sync
        run: uv run python -m eval_kit.golden.generate --check
      # Exit 1 when a stack does not start or the tool writes no report. A failing case is a
      # result (the golden set holds six wrong answers on purpose), not a job failure.
      - name: DeepEval on echo-python and echo-langgraph
        run: >-
          uv run python -m eval_kit.evaltrial --tool deepeval
          --engine echo-python,echo-langgraph --lane sidecar --out eval-reports
      - name: Same report format on both engines
        run: |
          uv run python - <<'PY'
          import json, pathlib
          from eval_kit.evalreport import validate_report
          from eval_kit.golden import load_cases
          ids = sorted(c.id for c in load_cases())
          for engine in ("echo-python", "echo-langgraph"):
              report = json.loads(pathlib.Path(f"eval-reports/deepeval-{engine}.json").read_text())
              validate_report(report)
              assert [c["id"] for c in report["cases"]] == ids, engine
              print(engine, report["summary"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: poc07-eval-reports
          path: eval-reports/
          if-no-files-found: error
