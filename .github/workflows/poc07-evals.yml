name: poc07-evals

# PoC-7 exit criterion 8: the picked eval tool (DeepEval 4.3.2) on the 20 golden cases, for two
# engines in the sidecar lane, through the chassis's /v1/run. The engines' model and the judge are
# the scripted fake model server: no secret, no hosted model, no egress beyond package installs.
# Telemetry is off (DEEPEVAL_TELEMETRY_OPT_OUT=1, set by the launcher). The reports
# (eval-report.v0 and DeepEval's own JSON) are uploaded as artifacts.
# Local: uv run python -m bakeoff.evaltrial --tool deepeval --out /tmp/evals

on:
  push:
    paths:
      - "evals/**"
      - "packages/bakeoff/**"
      - "packages/fake-model-server/**"
      - "packages/chassis/**"
      - "packages/workloads/echo-python/**"
      - "packages/workloads/echo-langgraph/**"
      - ".github/workflows/poc07-evals.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poc07-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --locked
      - name: Golden files in sync
        run: uv run python -m bakeoff.golden.generate --check
      # Exit 1 when a stack does not start or the tool writes no report. A failing case is a
      # result (the golden set holds six wrong answers on purpose), not a job failure.
      - name: DeepEval on echo-python and echo-langgraph
        run: >-
          uv run python -m bakeoff.evaltrial --tool deepeval
          --engine echo-python,echo-langgraph --lane sidecar --out eval-reports
      - name: Same report format on both engines
        run: |
          uv run python - <<'PY'
          import json, pathlib
          from bakeoff.evalreport import validate_report
          from bakeoff.golden import load_cases
          ids = sorted(c.id for c in load_cases())
          for engine in ("echo-python", "echo-langgraph"):
              report = json.loads(pathlib.Path(f"eval-reports/deepeval-{engine}.json").read_text())
              validate_report(report)
              assert [c["id"] for c in report["cases"]] == ids, engine
              print(engine, report["summary"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: poc07-eval-reports
          path: eval-reports/
          if-no-files-found: error
