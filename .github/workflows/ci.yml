name: check

# `check` is the required check. It and `lint-extra` run on every pull request and every push to
# main. A branch push with a PR open would only repeat the PR run (no duplicate runs, 2026-11-08);
# a branch with no PR gets no CI. The images build in images.yml, the TypeScript workload in
# typescript.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer PR push cancels the old run; on main every merge keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The same commit took 10m45s and over 15m on two runs: keep a margin, not the mean.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          # The version the Dockerfiles pin (ghcr.io/astral-sh/uv:0.11.23).
          version: "0.11.23"
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --locked
      # `uv sync --locked` stores no registry index, and PoC-9's scaffold tests run `uv lock`
      # offline. This fills the cache and writes nothing.
      - name: Fill the uv cache
        run: uv lock --refresh --dry-run
      # The same gate developers run. CI and local must not diverge.
      - name: Check
        run: make check

  # Extra linters, kept out of `make check` so the pre-commit hook stays fast.
  # `make lint-extra` runs the same steps locally; uv.lock pins every tool by hash.
  lint-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --locked
      - name: Lint extra
        run: make lint-extra
