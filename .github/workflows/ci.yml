name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          # The version the Dockerfiles pin (ghcr.io/astral-sh/uv:0.11.23).
          version: "0.11.23"
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --locked
      # The same gate developers run. CI and local must not diverge.
      - name: Check
        run: make check

  # Extra linters, kept out of `make check` so the pre-commit hook stays fast.
  # `make lint-extra` runs the same steps locally; uv.lock pins every tool by hash.
  lint-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --locked
      - name: Lint extra
        run: make lint-extra

  # The TypeScript workload. `make ts-check` runs the same steps locally.
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/workloads/echo-typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The image is node:24-slim (packages/workloads/echo-typescript/Dockerfile).
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/workloads/echo-typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Every image builds, and runs as the uid in the table (deploy/README.md, "Container uids";
  # packages/chassis/tests/test_image_uids.py checks the files, this job checks the built images).
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: chassis, dockerfile: packages/chassis/Dockerfile, context: ., uid: "10001"}
          - {name: echo-python, dockerfile: packages/workloads/echo-python/Dockerfile, context: ., uid: "10002"}
          - {name: echo-pydanticai, dockerfile: packages/workloads/echo-pydanticai/Dockerfile, context: ., uid: "10002"}
          - {name: echo-langgraph, dockerfile: packages/workloads/echo-langgraph/Dockerfile, context: ., uid: "10002"}
          - {name: echo-openai-agents, dockerfile: packages/workloads/echo-openai-agents/Dockerfile, context: ., uid: "10002"}
          - {name: echo-claude-agent, dockerfile: packages/workloads/echo-claude-agent/Dockerfile, context: ., uid: "10002"}
          - {name: echo-smolagents, dockerfile: packages/workloads/echo-smolagents/Dockerfile, context: ., uid: "10002"}
          - {name: echo-typescript, dockerfile: packages/workloads/echo-typescript/Dockerfile, context: packages/workloads/echo-typescript, uid: "10002"}
          - {name: code-runner, dockerfile: packages/code-runner/Dockerfile, context: ., uid: "10003"}
          - {name: fake-model-server, dockerfile: packages/fake-model-server/Dockerfile, context: ., uid: "10004"}
          - {name: fake-mcp-server, dockerfile: packages/fake-mcp-server/Dockerfile, context: ., uid: "10005"}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t "ci/${{ matrix.name }}" -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"
      - name: User matches the uid table
        run: |
          user="$(docker image inspect -f '{{.Config.User}}' "ci/${{ matrix.name }}")"
          echo "image user: ${user}"
          test "${user}" = "${{ matrix.uid }}:${{ matrix.uid }}"
      # No --read-only here: that would refuse the write for the wrong reason. This checks ownership.
      - name: App code is not writable by the app user
        run: |
          docker run --rm --entrypoint sh "ci/${{ matrix.name }}" -c \
            'if touch /app/.write-probe 2>/dev/null; then echo "/app is writable"; exit 1; fi; id -u'
      - name: Size
        run: docker image ls "ci/${{ matrix.name }}" --format '{{.Repository}} {{.Size}}'
