name: check

# `check` runs on every push on every branch and every pull request: it is the required check.
# `lint-extra` and `typescript` run on pull requests and on main. The images build in images.yml.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The same commit took 10m45s and over 15m on two runs: keep a margin, not the mean.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          # The version the Dockerfiles pin (ghcr.io/astral-sh/uv:0.11.23).
          version: "0.11.23"
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --locked
      # `uv sync --locked` stores no registry index, and PoC-9's scaffold tests run `uv lock`
      # offline. This fills the cache and writes nothing.
      - name: Fill the uv cache
        run: uv lock --refresh --dry-run
      # The same gate developers run. CI and local must not diverge.
      - name: Check
        run: make check

  # Extra linters, kept out of `make check` so the pre-commit hook stays fast.
  # `make lint-extra` runs the same steps locally; uv.lock pins every tool by hash.
  lint-extra:
    # A branch push with an open PR would run this twice: run it on the PR and on main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --locked
      - name: Lint extra
        run: make lint-extra

  # The TypeScript workload. `make ts-check` runs the same steps locally.
  typescript:
    # A branch push with an open PR would run this twice: run it on the PR and on main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/workloads/echo-typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The image is node:24-slim (packages/workloads/echo-typescript/Dockerfile).
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/workloads/echo-typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
