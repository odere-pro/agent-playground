name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          # The version the Dockerfiles pin (ghcr.io/astral-sh/uv:0.11.23).
          version: "0.11.23"
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --locked
      # The same gate developers run. CI and local must not diverge.
      - name: Check
        run: make check

  # The TypeScript workload. `make ts-check` runs the same steps locally.
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/workloads/echo-typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The image is node:24-slim (packages/workloads/echo-typescript/Dockerfile).
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/workloads/echo-typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
