# Every container image builds and runs as the uid in the table (moved out of ci.yml on 2026-11-08).
#
# Trigger: pull_request and push to main on what an image is built from (the Dockerfiles, the
# packages, the root pyproject and lock), and workflow_dispatch. Never pull_request_target. A
# docs-only or PoC-only change builds no image. No secret is used. Every action is pinned by a full
# commit SHA, the same as ci.yml.
name: images

on:
  pull_request:
    paths: &image-paths
      - "**/Dockerfile"
      - "**/.dockerignore"
      - ".dockerignore"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
    paths: *image-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  # A newer PR push cancels the old run; on main every merge keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every image builds, and runs as the uid in the table (deploy/README.md, "Container uids";
  # packages/chassis/tests/test_image_uids.py checks the files, this job checks the built images).
  # One job, not one per image: each build takes under a minute, and a job per image spent most of
  # its time on runner setup and filled the queue (2026-11-08). A failure names its image.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build each image and check its uid and read-only app code
        env:
          DOCKER_BUILDKIT: "1"
          # name dockerfile context uid
          IMAGES: |
            chassis packages/chassis/Dockerfile . 10001
            echo-python packages/workloads/echo-python/Dockerfile . 10002
            echo-pydanticai packages/workloads/echo-pydanticai/Dockerfile . 10002
            echo-langgraph packages/workloads/echo-langgraph/Dockerfile . 10002
            echo-openai-agents packages/workloads/echo-openai-agents/Dockerfile . 10002
            echo-claude-agent packages/workloads/echo-claude-agent/Dockerfile . 10002
            echo-smolagents packages/workloads/echo-smolagents/Dockerfile . 10002
            echo-typescript packages/workloads/echo-typescript/Dockerfile packages/workloads/echo-typescript 10002
            code-runner packages/code-runner/Dockerfile . 10003
            fake-model-server packages/fake-model-server/Dockerfile . 10004
            fake-mcp-server packages/fake-mcp-server/Dockerfile . 10005
        run: |
          set -uo pipefail
          failed=()
          while read -r name dockerfile context uid; do
            [[ -n "$name" ]] || continue
            echo "::group::$name"
            if ! docker build -t "ci/$name" -f "$dockerfile" "$context"; then
              echo "::error::$name: the build failed"; failed+=("$name"); echo "::endgroup::"; continue
            fi
            user="$(docker image inspect -f '{{.Config.User}}' "ci/$name")"
            echo "image user: $user"
            if [[ "$user" != "$uid:$uid" ]]; then
              echo "::error::$name: runs as '$user', the uid table says $uid:$uid"; failed+=("$name")
            fi
            # No --read-only here: that would refuse the write for the wrong reason. This checks
            # ownership.
            if ! docker run --rm --entrypoint sh "ci/$name" -c \
              'if touch /app/.write-probe 2>/dev/null; then echo "/app is writable"; exit 1; fi; id -u'; then
              echo "::error::$name: /app is writable by the app user"; failed+=("$name")
            fi
            docker image ls "ci/$name" --format '{{.Repository}} {{.Size}}'
            docker image rm -f "ci/$name" >/dev/null
            echo "::endgroup::"
          done <<<"$IMAGES"
          df -h / | tail -1
          if (( ${#failed[@]} )); then
            echo "::error::failed images: ${failed[*]}"
            exit 1
          fi
          echo "every image ok"
