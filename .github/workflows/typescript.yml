# The TypeScript workload (moved out of ci.yml on 2026-11-08). `make ts-check` runs the same steps.
#
# Trigger: pull_request and push to main on the workload's own folder, and workflow_dispatch.
# Never pull_request_target. No secret is used. Every action is pinned by a full commit SHA, the
# same as ci.yml.
name: typescript

on:
  pull_request:
    paths: &ts-paths
      - packages/workloads/echo-typescript/**
      - .github/workflows/typescript.yml
  push:
    branches: [main]
    paths: *ts-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/workloads/echo-typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The image is node:24-slim (packages/workloads/echo-typescript/Dockerfile).
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/workloads/echo-typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
