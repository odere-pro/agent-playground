# PoC-5 remote lane on kind (plan docs/plans/2026-10-02-poc-05-sandboxed.md, section 7, T24).
#
# Known gap: install-gvisor.sh pins the gVisor sha512 for aarch64 only. The x86_64 sha512 is not
# pinned yet, so on an ubuntu-latest (x86_64) runner this job fails closed at the gVisor step of
# `run.sh up` until that sum is pinned from the gVisor release's published .sha512 file (checked
# out of band). The job never skips the check. Until then, the offline remote lane in `make check`
# (ci.yml, LaneContract over the remote lane) stays the every-commit gate (hard requirement 2).
#
# Trigger: manual (workflow_dispatch) until the x86_64 sum is pinned and the kind remote tests
# exist; then switch to push and pull_request (test_poc05_ci_wiring.py enforces both states).
#
# No secret is used: the seed step makes every credential inside the cluster.
# kind and kubectl are pinned by version and checked against the sha256 file each project
# publishes next to the binary; that file is fetched in the job from the same release.
name: remote-lane

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.37.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5, verify the SHA before the first cloud deploy
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --frozen
      - name: Install kind
        run: |
          set -euo pipefail
          base="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLo kind-linux-amd64 "${base}/kind-linux-amd64"
          curl -fsSLo kind-linux-amd64.sha256sum "${base}/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
          kind version
      - name: Install kubectl
        run: |
          set -euo pipefail
          base="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64"
          cd "$RUNNER_TEMP"
          curl -fsSLo kubectl "${base}/kubectl"
          curl -fsSLo kubectl.sha256 "${base}/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client
      # Create, gVisor, build, load, seed, apply, one request per lane (run.sh header).
      - name: Up
        run: deploy/kind/poc05/run.sh up
      - name: Remote lane and code-runner suites
        run: deploy/kind/poc05/run.sh test-remote
      # No upload-artifact SHA is pinned in this repo yet, so logs go to the job output.
      - name: Pod logs and probe results
        if: failure()
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/poc05-logs"
          mkdir -p "$dir"
          for ns in $(kubectl --context kind-poc05 get namespaces -o name 2>/dev/null |
            sed 's|^namespace/||' | grep '^poc05-'); do
            kubectl --context kind-poc05 -n "$ns" get pods -o wide > "$dir/$ns.pods.txt" 2>&1
            for pod in $(kubectl --context kind-poc05 -n "$ns" get pods -o name 2>/dev/null); do
              kubectl --context kind-poc05 -n "$ns" logs "$pod" --all-containers --tail=200 \
                > "$dir/$ns.${pod#pod/}.log" 2>&1
            done
          done
          for f in "$dir"/* pocs/poc-05-sandboxed/notes/hostile/*.jsonl; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
      - name: Delete
        if: always()
        run: deploy/kind/poc05/run.sh delete
