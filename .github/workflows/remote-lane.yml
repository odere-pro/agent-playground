# PoC-5 remote lane on kind (plan docs/plans/2026-10-02-poc-05-sandboxed.md, section 7, T24).
#
# Trigger: push, pull_request, and workflow_dispatch. Never pull_request_target. The switch from
# manual came once the three pins held (test_poc05_ci_wiring.py now requires them): the x86_64
# gVisor sha512 in install-gvisor.sh, the kind remote test files in run.sh REMOTE_TESTS, and
# KIND_SHA256 and KUBECTL_SHA256 below. Each install step still fails closed on a bad sum.
#
# Open: no spike has run gVisor (systrap, nested under Docker) on a GitHub ubuntu-latest runner.
# If runsc cannot start there, the job fails at the gVisor step of `run.sh up`; it never skips the
# check. The offline remote lane in `make check` (ci.yml, LaneContract over the remote lane)
# stays the every-commit gate either way (hard requirement 2).
#
# No secret is used: the seed step makes every credential inside the cluster. Pod logs go
# through run.sh `logs`, which sends each through redact_logs (the one filter, in run.sh).
# kind and kubectl are pinned by version and by a sha256 in the job env, each read once from the
# project's published sha256 file; the job never fetches a sum from the same release.
name: remote-lane

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.37.0
      # From https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  # pragma: allowlist secret (public sha256)
      # From https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  # pragma: allowlist secret (public sha256)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --frozen
      - name: Install kind
        run: |
          set -euo pipefail
          [[ ${KIND_SHA256} =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::KIND_SHA256 is not pinned; refusing to install kind"; exit 1; }
          base="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLo kind-linux-amd64 "${base}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind-linux-amd64" | sha256sum -c -
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
          kind version
      - name: Install kubectl
        run: |
          set -euo pipefail
          [[ ${KUBECTL_SHA256} =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::KUBECTL_SHA256 is not pinned; refusing to install kubectl"; exit 1; }
          base="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64"
          cd "$RUNNER_TEMP"
          curl -fsSLo kubectl "${base}/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client
      # Create, gVisor, build, load, seed, apply, one request per lane (run.sh header).
      - name: Up
        run: deploy/kind/poc05/run.sh up
      - name: Remote lane and code-runner suites
        run: deploy/kind/poc05/run.sh test-remote
      # No upload-artifact SHA is pinned in this repo yet, so logs go to the job output. Every
      # pod log goes through run.sh `logs` (redact_logs, pinned to kind-poc05); never a bare
      # `kubectl logs` here (test_poc05_ci_wiring.py).
      - name: Pod logs and probe results
        if: failure()
        run: |
          set -uo pipefail
          deploy/kind/poc05/run.sh logs
          for f in pocs/poc-05-sandboxed/notes/hostile/*.jsonl; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            deploy/kind/poc05/run.sh redact < "$f"
            echo "::endgroup::"
          done
      - name: Delete
        if: always()
        run: deploy/kind/poc05/run.sh delete
