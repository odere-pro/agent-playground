# PoC-9 exit criteria 1 and 4: scaffold an agent per framework, then run its own `make` steps. About
# a minute per agent, so not in `make check`, which must stay quick. The tests skip without
# POC09_SCAFFOLD=1; a skip here would look green, so the step needs the exact pass count.
#
# Trigger: pull_request on what a scaffold is made of, push to main on the same paths (since
# 2026-11-08: a branch push repeated the PR run), and workflow_dispatch. No secret.
name: poc09-scaffold

on:
  push:
    branches: [main]
    paths: &scaffold-paths
      - packages/agentctl/**
      - packages/agent-testkit/**
      - packages/workload-a2a/**
      - packages/chassis/**
      - pocs/poc-09-agent-mvp-template/tests/test_poc09_scaffold.py
      - .github/workflows/poc09-scaffold.yml
      - uv.lock
  pull_request:
    paths: *scaffold-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poc09-scaffold-${{ github.ref }}
  # A newer PR push cancels the old run; on main every merge keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  poc09-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.11.23"
          # No uv cache on pull_request: PR code cannot poison what a push run restores.
          enable-cache: ${{ github.event_name != 'pull_request' }}
      - name: Sync
        run: uv sync --all-packages --locked
      # The scaffold runs `uv lock` offline; `uv sync --locked` stores no registry index.
      - name: Fill the uv cache
        run: uv lock --refresh --dry-run
      - name: Full scaffold runs
        env:
          POC09_SCAFFOLD: "1"
        run: |
          set -euo pipefail
          scripts/check_offline.sh -q -k "c1_scaffolded or c4_ci" \
            pocs/poc-09-agent-mvp-template/tests/test_poc09_scaffold.py | tee scaffold.log
          grep -q "12 passed" scaffold.log
