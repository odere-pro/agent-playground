# Shutdown order: the chassis gets SIGTERM, sets /ready to 503, and keeps serving for
# --drain-delay-s 10 with `Connection: close` on every response, so keep-alive clients reconnect
# through the Service to another replica. suggested: 10 s > endpoint removal + the client's idle
# keep-alive window (httpx `keepalive_expiry` 5 s): a connection idle through the whole delay never
# sees the header. Then it stops accepting, waits up to --drain-timeout-s 30 for in-flight runs,
# and exits. Only then does the workload get SIGTERM, with nothing in flight; it waits up to its
# own --drain-timeout-s 30. terminationGracePeriodSeconds 50 = 10 + 30 + 10 (suggested).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: poc04
    poc04/variant: native-sidecar
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: poc04
        poc04/variant: native-sidecar
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 50
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: workload
          image: agent-platform/echo-python:poc04
          imagePullPolicy: Never
          # The native sidecar: an init container that keeps running.
          restartPolicy: Always
          # Appended to the image's `workload-a2a serve ... --host $HOST --port $PORT`.
          args: ["--drain-timeout-s", "30"]
          env:
            # The only four variables a workload gets: no key, no Secret (SECURITY.md, 6).
            - name: HOST
              value: 127.0.0.1
            - name: PORT
              value: "9000"
            - name: CHASSIS_MODEL_URL
              value: http://127.0.0.1:8090/v1
            - name: CHASSIS_TOOL_URL
              value: http://127.0.0.1:8090/mcp
          # The workload listens on 127.0.0.1 only and the kubelet's httpGet goes to the pod IP,
          # so both probes exec a GET on the agent card inside the container.
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/.well-known/agent-card.json', timeout=2).status == 200 else 1)"
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/.well-known/agent-card.json', timeout=2).status == 200 else 1)"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            # suggested: a liveness kill skips the preStop sleep and the pod's grace. A hung
            # (stopped) process ignores SIGTERM, so it is killed after 10 s, not 45 or 50.
            terminationGracePeriodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workload-tmp
              mountPath: /tmp
      containers:
        - name: chassis
          image: agent-platform/chassis:poc04
          imagePullPolicy: Never
          # The image's ENTRYPOINT is `chassis serve`. The public port binds the pod IP, not
          # 0.0.0.0, so loopback carries only the proxies (127.0.0.1:8090, the default).
          args:
            - --config
            - /etc/chassis/config.yaml
            - --host
            - $(POD_IP)
            - --port
            - "8080"
            - --drain-delay-s
            - "10"
            - --drain-timeout-s
            - "30"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LITELLM_BASE_URL
              value: http://fake-model-server:8081/v1
            - name: VALKEY_URL
              value: valkey://valkey:6379/0
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poc04-secrets
                  key: VALKEY_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          # suggested: up to 60 s to start before liveness counts.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # ADR-001's upper estimate. No CPU limit (suggested): throttling would skew the
            # sidecar cost measurement.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: chassis-tmp
              mountPath: /tmp
            - name: chassis-config
              mountPath: /etc/chassis
              readOnly: true
      volumes:
        # One /tmp per container: a shared writable volume would be a side channel.
        - name: chassis-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: workload-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: chassis-config
          configMap:
            name: chassis-bootstrap
