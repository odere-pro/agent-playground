# The library chart's kind cluster: one node, named `agent-chart`, so every command can
# say `--context kind-agent-chart` and never touch another cluster. run.sh creates and deletes it.
#
# The node image is the one PoC-4 and PoC-9 ran (kind v0.33.0's default), pinned by digest.
#
# One host port: 127.0.0.1:18082 -> nodePort 30082, the drill's NodePort Service in front of the
# chassis port (nodeport.yaml). Loopback only. suggested: 18082 (18081 is PoC-4's kind cluster,
# 18080 the Compose scale stack's Traefik).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agent-chart
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30082
        hostPort: 18082
        listenAddress: 127.0.0.1
        protocol: TCP
