# remote-typescript: the TypeScript agent as a remote (PoC-6b). The shape is
# deploy/kind/poc05/remote/remote-echo.yaml, with the Node image of the sidecar lane
# (kind.local/agent-platform/echo-typescript:poc05, built by `poc05/run.sh build`).
#
# - `--require-token-env CHASSIS_API_TOKEN` puts the bearer check on every request, the agent card
#   included, and lets HOST be the pod IP. Drain is DRAIN_TIMEOUT_MS, not a flag.
# - The Node image has no Python. The PoC-5 in-pod checks (`kubectl exec ... python`) cannot run
#   here; the kind tests use a small Node probe instead (test_poc06b_kind_remote_controls.py), and
#   record what it does not cover.
# - Its chassis is `chassis-typescript-remote` in poc05-agents.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remote-typescript
  labels:
    app.kubernetes.io/name: remote-typescript
automountServiceAccountToken: false
---
# One fresh pod per run (core review R6-11): the warm pool below keeps pods of this template
# started; the front door (deploy/kind/poc06/platform/remote-run-dispatch.yaml) claims one
# per A2A run and deletes the claim after, which deletes the pod. Template rules T1 to T5
# (deploy/kind/poc05/admission/extension-policy.yaml): Unmanaged network policy (ours is
# network-policy.yaml), no env injection, no volume claims, no Service (the door dials pod IPs).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: remote-typescript
  labels:
    app.kubernetes.io/name: remote-typescript
spec:
  networkPolicyManagement: Unmanaged
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  service: false
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: remote-typescript
        app.kubernetes.io/part-of: poc06
        agents.platform/lane: remote
        agents.platform/trust: untrusted
    spec:
      serviceAccountName: remote-typescript
      automountServiceAccountToken: false
      enableServiceLinks: false
      runtimeClassName: gvisor
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        # Localhost, not RuntimeDefault: runsc maps RuntimeDefault's clone3 ENOSYS to EPERM and
        # threads fail. deploy/kind/poc06/run.sh `seccomp` writes it; note lanes-b-kind.md.
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/poc06-runsc-clone3.json
      containers:
        - name: workload
          image: kind.local/agent-platform/echo-typescript:poc05
          imagePullPolicy: Never
          args: ["--require-token-env", "CHASSIS_API_TOKEN"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOST
              value: $(POD_IP)
            - name: PORT
              value: "9000"
            - name: CHASSIS_MODEL_URL
              value: http://10.96.85.94:8091/v1
            - name: CHASSIS_TOOL_URL
              value: http://10.96.85.94:8091/mcp
            - name: DRAIN_TIMEOUT_MS
              value: "30000"
            - name: CHASSIS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-typescript-token
                  key: token
          ports:
            - name: a2a
              containerPort: 9000
          startupProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # Localhost, not RuntimeDefault: runsc maps RuntimeDefault's clone3 ENOSYS to EPERM and
            # threads fail. deploy/kind/poc06/run.sh `seccomp` writes it; note lanes-b-kind.md.
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/poc06-runsc-clone3.json
          volumeMounts:
            - name: workload-tmp
              mountPath: /tmp
      volumes:
        - name: workload-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
# suggested: 1 warm pod per engine. A run that finds the pool empty waits for a cold start
# (the door's claim timeout); it does not fail.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: remote-typescript
  labels:
    app.kubernetes.io/name: remote-typescript
spec:
  replicas: 1
  sandboxTemplateRef:
    name: remote-typescript
