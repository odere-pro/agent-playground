# remote-smolagents: the smolagents CodeAgent as a remote (PoC-6b, exit criteria 1 and 4). The shape
# is deploy/kind/poc05/remote/remote-echo.yaml: an agent-sandbox Sandbox on gVisor, the token
# required on every path, one Secret (its own token), no DNS, egress to its chassis's port 8091 only.
#
# - The model's Python runs in this process (LocalPythonExecutor, an AST interpreter, not a
#   boundary). The boundary is this pod: gVisor, no key, one edge. The code writes nothing to disk;
#   /tmp is the emptyDir the image's HOME points at.
# - Memory is 512Mi (suggested): smolagents, openai, and mcp import about 150 MiB.
# - Its chassis is `chassis-smolagents-remote` in poc05-agents (agents/chassis-smolagents-remote.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remote-smolagents
  labels:
    app.kubernetes.io/name: remote-smolagents
automountServiceAccountToken: false
---
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: remote-smolagents
  labels:
    app.kubernetes.io/name: remote-smolagents
spec:
  service: false
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: remote-smolagents
        app.kubernetes.io/part-of: poc06
        agents.platform/lane: remote
        agents.platform/trust: untrusted
    spec:
      serviceAccountName: remote-smolagents
      automountServiceAccountToken: false
      enableServiceLinks: false
      runtimeClassName: gvisor
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workload
          image: kind.local/agent-platform/echo-smolagents:poc06
          imagePullPolicy: Never
          args: ["--require-token-env", "CHASSIS_API_TOKEN", "--drain-timeout-s", "30"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOST
              value: $(POD_IP)
            - name: PORT
              value: "9000"
            - name: CHASSIS_MODEL_URL
              value: http://10.96.85.92:8091/v1
            - name: CHASSIS_TOOL_URL
              value: http://10.96.85.92:8091/mcp
            - name: CHASSIS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-smolagents-token
                  key: token
          ports:
            - name: a2a
              containerPort: 9000
          startupProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: workload-tmp
              mountPath: /tmp
      volumes:
        - name: workload-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
# The chassis reaches the remote by name (it has DNS): remote-smolagents.poc05-remote.svc.cluster.local.
apiVersion: v1
kind: Service
metadata:
  name: remote-smolagents
  labels:
    app.kubernetes.io/name: remote-smolagents
spec:
  selector:
    app.kubernetes.io/name: remote-smolagents
  ports:
    - name: a2a
      port: 9000
      targetPort: 9000
