# remote-claude-agent: the Claude Agent SDK with its shell and file tools on, as a remote (PoC-6b,
# exit criteria 1 and 4). The shape is deploy/kind/poc05/remote/remote-echo.yaml.
#
# What the CLI needs (packages/workloads/echo-claude-agent/README.md, "What it writes and spawns"):
# - A writable $HOME and work dir. Each run makes HOME under CLAUDE_AGENT_HOME_BASE and removes it.
#   Here that is /tmp, the one emptyDir (memory-backed, 128Mi): `.claude.json`, the transcript, and
#   what the Bash and Write tools write. The root file system stays read-only. Admission rule T4
#   forbids only volume claim templates, so an emptyDir is fine.
# - Memory: the bundled `claude` ELF is 175 to 240 MB resident; 1Gi limit (suggested), and /tmp
#   counts against it.
# - The env guard: the workload refuses to start a run if any ANTHROPIC_* or CLAUDE_* variable is
#   set that it does not override. The only CLAUDE_* variable here is CLAUDE_AGENT_HOME_BASE, which
#   it allows. The pod sets no provider key (the pod has no key to give); the ANTHROPIC_* variables
#   are made per run, inside the process, from CHASSIS_MODEL_URL and CHASSIS_API_TOKEN.
# - Model calls: the CLI posts to <CHASSIS_MODEL_URL minus /v1>/v1/messages on the chassis's remote
#   listener (contract v5 part A), with its own token as the bearer, and the run's traceparent.
# - Its chassis is `chassis-claude-agent-remote` in poc05-agents.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remote-claude-agent
  labels:
    app.kubernetes.io/name: remote-claude-agent
automountServiceAccountToken: false
---
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: remote-claude-agent
  labels:
    app.kubernetes.io/name: remote-claude-agent
spec:
  service: false
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: remote-claude-agent
        app.kubernetes.io/part-of: poc06
        agents.platform/lane: remote
        agents.platform/trust: untrusted
    spec:
      serviceAccountName: remote-claude-agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      runtimeClassName: gvisor
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        # Localhost, not RuntimeDefault: runsc maps RuntimeDefault's clone3 ENOSYS to EPERM and
        # threads fail. deploy/kind/poc06/run.sh `seccomp` writes it; note lanes-b-kind.md.
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/poc06-runsc-clone3.json
      containers:
        - name: workload
          image: kind.local/agent-platform/echo-claude-agent:poc06
          imagePullPolicy: Never
          args: ["--require-token-env", "CHASSIS_API_TOKEN", "--drain-timeout-s", "30"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOST
              value: $(POD_IP)
            - name: PORT
              value: "9000"
            - name: CHASSIS_MODEL_URL
              value: http://10.96.85.93:8091/v1
            - name: CHASSIS_TOOL_URL
              value: http://10.96.85.93:8091/mcp
            # Where each run makes its HOME and work dir: the /tmp emptyDir below. The workload
            # allows this one CLAUDE_* variable (OVERRIDDEN in its handle.py); it sets no other.
            - name: CLAUDE_AGENT_HOME_BASE
              value: /tmp
            - name: HOME
              value: /tmp
            - name: CHASSIS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-claude-agent-token
                  key: token
          ports:
            - name: a2a
              containerPort: 9000
          startupProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # Localhost, not RuntimeDefault: runsc maps RuntimeDefault's clone3 ENOSYS to EPERM and
            # threads fail. deploy/kind/poc06/run.sh `seccomp` writes it; note lanes-b-kind.md.
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/poc06-runsc-clone3.json
          volumeMounts:
            - name: workload-tmp
              mountPath: /tmp
      volumes:
        - name: workload-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
# The chassis reaches the remote by name (it has DNS): remote-claude-agent.poc05-remote.svc.cluster.local.
apiVersion: v1
kind: Service
metadata:
  name: remote-claude-agent
  labels:
    app.kubernetes.io/name: remote-claude-agent
spec:
  selector:
    app.kubernetes.io/name: remote-claude-agent
  ports:
    - name: a2a
      port: 9000
      targetPort: 9000
