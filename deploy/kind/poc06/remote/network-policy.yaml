# poc05-remote: what each PoC-6 remote may send and receive. The namespace's `default-deny`
# refuses everything else. No ipBlock, no DNS rule: a remote that asks for a name gets no answer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remote-smolagents
  namespace: poc05-remote
  labels:
    app.kubernetes.io/part-of: poc06
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: remote-smolagents
  policyTypes: [Ingress, Egress]
  # 9000 only from the front door, which claimed this pod for one run (core review R6-11).
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-run-dispatch
      ports:
        - port: 9000
          protocol: TCP
  # Its chassis's remote proxy port, and nothing else: no DNS, no ipBlock.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: chassis-smolagents-remote
      ports:
        - port: 8091
          protocol: TCP

