# poc05-agents: the NetworkPolicy of chassis-kagent-adk-remote (chassis-kagent-adk-remote.yaml).
# Its own file: run.sh applies it by path as the cluster admin, with -n poc05-agents; the
# kustomization does not list it, so the deployer never sends a NetworkPolicy (R5a-02).
# 8091 only from its own remote's pod label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: poc05-agents
  name: chassis-kagent-adk-remote
  labels:
    app.kubernetes.io/part-of: poc06
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chassis-kagent-adk-remote
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-platform-system
          podSelector:
            matchLabels:
              agents.platform/role: gateway
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-remote
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-kagent-adk
      ports:
        - port: 8091
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-run-dispatch
      ports:
        - port: 9004
          protocol: TCP
