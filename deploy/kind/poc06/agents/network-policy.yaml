# poc05-agents: what each PoC-6 chassis pod may send and receive. The namespace's `default-deny`
# refuses everything else, both ways. Peers are pod labels plus the namespace name; no ipBlock.
# The 8080 rule takes only the gateway peer, as in PoC-5 (core review R5a-07; suggested: a pod in
# agent-platform-system labeled agents.platform/role: gateway, whose egress is
# ../../poc05/agents/gateway-network-policy.yaml). A policy cannot tell the two containers of a
# sidecar pod apart (shared network namespace), so the sidecar workload rides the chassis's egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-openai-agents
  namespace: poc05-agents
  labels:
    app.kubernetes.io/part-of: poc06
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-openai-agents
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-platform-system
          podSelector:
            matchLabels:
              agents.platform/role: gateway
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - port: 6379
          protocol: TCP

