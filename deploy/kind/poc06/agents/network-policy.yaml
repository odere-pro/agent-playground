# poc05-agents: what each PoC-6 chassis pod may send and receive. The namespace's `default-deny`
# refuses everything else, both ways. Peers are pod labels plus the namespace name; no ipBlock.
# The 8080 rule matters for in-cluster callers only; a policy cannot tell the two containers of a
# sidecar pod apart (shared network namespace), so the sidecar workload rides the chassis's egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-openai-agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-openai-agents
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - port: 6379
          protocol: TCP

