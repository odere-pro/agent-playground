# The chassis config for `chassis-claude-agent-remote`: the remote lane, workload `remote-claude-agent` in poc05-remote
# reached through the front door remote-run-dispatch, one fresh pod per run (R6-11). The chassis sends the per-remote token from REMOTE_TOKEN (the
# Secret `remote-claude-agent-token`, chassis container only) on every A2A call, and its remote proxy
# listener (pod IP, 8091) accepts the same token from the remote. `config: memory`, as PoC-5.
profile: local
agent:
  name: echo-claude-agent-remote
  version: 0.0.1
spec:
  trust: untrusted
  adapters:
    model: litellm
    config: memory
    state: valkey
    telemetry: memory
    tools: mcp
    events: none
  engine:
    connector: remote
    url: http://remote-run-dispatch.poc05-platform.svc.cluster.local:9001/claude-agent
    auth:
      scheme: bearer
      token_env: REMOTE_TOKEN
      proxy_token_env: REMOTE_PROXY_TOKEN
  model:
    route: fake-chat
