# The chassis config for `chassis-typescript-remote`: the remote lane, workload `remote-typescript` in poc05-remote
# on 9000 (deploy/kind/poc06/remote/). The chassis sends the per-remote token from REMOTE_TOKEN (the
# Secret `remote-typescript-token`, chassis container only) on every A2A call, and its remote proxy
# listener (pod IP, 8091) accepts the same token from the remote. `config: memory`, as PoC-5.
profile: local
agent:
  name: echo-typescript-remote
  version: 0.0.1
spec:
  trust: untrusted
  adapters:
    model: litellm
    config: memory
    state: valkey
    telemetry: memory
    tools: mcp
    events: none
  engine:
    connector: remote
    url: http://remote-typescript.poc05-remote.svc.cluster.local:9000
    auth:
      scheme: bearer
      token_env: REMOTE_TOKEN
  model:
    route: fake-chat
