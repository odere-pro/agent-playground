# agent-openai-agents: the sidecar lane for openai-agents (PoC-6a/6b). The shape is deploy/kind/poc05/agents/agent-echo.yaml:
# the chassis is the native sidecar (an init container with `restartPolicy: Always`) and the
# workload is the main container; the workload reaches the chassis's proxies on 127.0.0.1:8090.
# Secrets go to the chassis container only (its LiteLLM virtual key, the Valkey password); the
# workload gets four plain variables. The accepted risks of the lane are listed in agent-echo.yaml.
# Admission: the workload repository is on `trustedRepositories` (deploy/kind/poc06/admission).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-openai-agents
  labels:
    app.kubernetes.io/name: agent-openai-agents
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-openai-agents
  labels:
    app.kubernetes.io/name: agent-openai-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-openai-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-openai-agents
        agents.platform/role: chassis
        agents.platform/lane: sidecar
        agents.platform/trust: trusted
    spec:
      serviceAccountName: agent-openai-agents
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 50
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: chassis
          image: kind.local/agent-platform/chassis:poc05
          imagePullPolicy: Never
          restartPolicy: Always
          args:
            - --config
            - /etc/chassis/config.yaml
            - --host
            - $(POD_IP)
            - --port
            - "8080"
            - --startup-wait-s
            - "120"
            - --drain-delay-s
            - "10"
            - --drain-timeout-s
            - "30"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LITELLM_BASE_URL
              value: http://litellm.poc05-platform.svc.cluster.local:4000/v1
            - name: LITELLM_MCP_URL
              value: http://litellm.poc05-platform.svc.cluster.local:4000/mcp/
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chassis-openai-agents-litellm
                  key: LITELLM_API_KEY
            - name: VALKEY_URL
              value: valkey://valkey.poc05-platform.svc.cluster.local:6379/0
            - name: VALKEY_USERNAME
              value: chassis
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: VALKEY_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: chassis-tmp
              mountPath: /tmp
            - name: chassis-config
              mountPath: /etc/chassis
              readOnly: true
      containers:
        - name: workload
          image: kind.local/agent-platform/echo-openai-agents:poc06
          imagePullPolicy: Never
          env:
            # The only four variables the workload gets: no key, no Secret.
            - name: HOST
              value: 127.0.0.1
            - name: PORT
              value: "9000"
            - name: CHASSIS_MODEL_URL
              value: http://127.0.0.1:8090/v1
            - name: CHASSIS_TOOL_URL
              value: http://127.0.0.1:8090/mcp
          # The workload listens on 127.0.0.1 only and the kubelet's httpGet goes to the pod IP,
          # so both probes exec a GET on the agent card inside the container.
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/.well-known/agent-card.json', timeout=2).status == 200 else 1)"
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/.well-known/agent-card.json', timeout=2).status == 200 else 1)"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: workload-tmp
              mountPath: /tmp
      volumes:
        - name: chassis-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: workload-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: chassis-config
          configMap:
            name: chassis-openai-agents-config
---
apiVersion: v1
kind: Service
metadata:
  name: agent-openai-agents
  labels:
    app.kubernetes.io/name: agent-openai-agents
spec:
  selector:
    app.kubernetes.io/name: agent-openai-agents
  ports:
    - name: http
      port: 8080
      targetPort: 8080
