---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-run-dispatch
  namespace: poc05-platform
  labels:
    app.kubernetes.io/name: remote-run-dispatch
    app.kubernetes.io/part-of: poc06
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-run-dispatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-run-dispatch
        app.kubernetes.io/part-of: poc06
    spec:
      serviceAccountName: remote-run-dispatch
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: remote-run-dispatch
          image: kind.local/agent-platform/code-runner:poc05
          imagePullPolicy: Never
          command: [code-runner]
          args:
            - a2a-dispatch
            - --namespace
            - poc05-remote
            - --cards-dir
            - /etc/remote-run-dispatch/cards
            - --public-url
            - http://remote-run-dispatch.poc05-platform.svc.cluster.local
            - --host
            - 0.0.0.0
            - --engine-port
            - claude-agent=9001
            - --engine-port
            - smolagents=9002
            - --engine-port
            - typescript=9003
            - --engine-port
            - kagent-adk=9004
          ports:
            - name: claude-agent
              containerPort: 9001
            - name: smolagents
              containerPort: 9002
            - name: typescript
              containerPort: 9003
            - name: kagent-adk
              containerPort: 9004
          startupProbe:
            httpGet:
              path: /health
              port: 9001
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # suggested: 192Mi; it holds at most a body cap per run and streams the rest.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10003
            runAsGroup: 10003
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: cards
              mountPath: /etc/remote-run-dispatch/cards
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: cards
          configMap:
            name: remote-run-dispatch-cards
---
apiVersion: v1
kind: Service
metadata:
  name: remote-run-dispatch
  namespace: poc05-platform
  labels:
    app.kubernetes.io/name: remote-run-dispatch
    app.kubernetes.io/part-of: poc06
spec:
  selector:
    app.kubernetes.io/name: remote-run-dispatch
  ports:
    - name: claude-agent
      port: 9001
      targetPort: 9001
    - name: smolagents
      port: 9002
      targetPort: 9002
    - name: typescript
      port: 9003
      targetPort: 9003
    - name: kagent-adk
      port: 9004
      targetPort: 9004
