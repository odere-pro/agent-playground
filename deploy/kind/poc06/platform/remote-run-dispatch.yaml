---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-run-dispatch
  namespace: poc05-platform
  labels:
    app.kubernetes.io/name: remote-run-dispatch
    app.kubernetes.io/part-of: poc06
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-run-dispatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-run-dispatch
        app.kubernetes.io/part-of: poc06
    spec:
      serviceAccountName: remote-run-dispatch
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: remote-run-dispatch
          image: kind.local/agent-platform/code-runner:poc05
          imagePullPolicy: Never
          command: [code-runner]
          args:
            - a2a-dispatch
            - --namespace
            - poc05-remote
            - --cards-dir
            - /etc/remote-run-dispatch/cards
            - --public-url
            - http://remote-run-dispatch.poc05-platform.svc.cluster.local:9000
            - --host
            - 0.0.0.0
            - --port
            - "9000"
          ports:
            - name: a2a
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health
              port: 9000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # suggested: 192Mi; it holds at most a body cap per run and streams the rest.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10003
            runAsGroup: 10003
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: cards
              mountPath: /etc/remote-run-dispatch/cards
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: cards
          configMap:
            name: remote-run-dispatch-cards
---
apiVersion: v1
kind: Service
metadata:
  name: remote-run-dispatch
  namespace: poc05-platform
  labels:
    app.kubernetes.io/name: remote-run-dispatch
    app.kubernetes.io/part-of: poc06
spec:
  selector:
    app.kubernetes.io/name: remote-run-dispatch
  ports:
    - name: a2a
      port: 9000
      targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remote-run-dispatch
  namespace: poc05-platform
  labels:
    app.kubernetes.io/part-of: poc06
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: remote-run-dispatch
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: chassis-smolagents-remote
      ports:
        - port: 9000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: chassis-claude-agent-remote
      ports:
        - port: 9000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: chassis-typescript-remote
      ports:
        - port: 9000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: chassis-kagent-adk-remote
      ports:
        - port: 9000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-remote
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-smolagents
      ports:
        - port: 9000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-remote
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-claude-agent
      ports:
        - port: 9000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-remote
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-typescript
      ports:
        - port: 9000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-remote
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-kagent-adk
      ports:
        - port: 9000
          protocol: TCP
    - to:
        - ipBlock:
            cidr: __API_SERVER_IP__/32
      ports:
        - port: 6443
          protocol: TCP
