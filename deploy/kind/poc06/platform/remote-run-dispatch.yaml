# remote-run-dispatch: the PoC-6 remote-run front door (core review R6-11). A remote pod used to
# be one long-lived Sandbox per engine, so runs shared its uid, /tmp, and process tree. Now each
# engine is a SandboxTemplate and SandboxWarmPool in poc05-remote (../remote/, ../kagent/), and
# every chassis remote URL is http://remote-run-dispatch.poc05-platform.svc.cluster.local:9000/<engine>.
# Per streaming A2A run the door creates a SandboxClaim on the pool remote-<engine>, waits for it,
# streams the run to and from the claimed pod's IP on 9000, and deletes the claim after (the pod
# goes with it). A card fetch never claims. Code: packages/code-runner/src/code_runner/a2a_dispatch.py.
#
# - Same image as the code-runner dispatcher, started as `code-runner a2a-dispatch`. runc, in
#   poc05-platform, restricted securityContext.
# - Its API credential: a projected token in its one container (suggested: expirationSeconds 3600)
#   and the cluster CA. Rights: create, get, delete on sandboxclaims in poc05-remote only
#   (../admission/remote-run-rbac.yaml, applied by the cluster admin), capped by a ResourceQuota.
# - No model key, tool key, or remote token. No inbound bearer of its own: each chassis sends its own
#   remote token, passed through untouched to the pod, whose workload checks it
#   (`--require-token-env`; kagent-adk checks none, see ../kagent/remote-kagent-adk.yaml).
# - The cards below are pinned here, not read from a pod: a fetch must not claim a pod. The door sets
#   each interface URL to its own /<engine> URL; the chassis pins it to its configured URL anyway.
# - NetworkPolicy (below): in on 9000 from the four remote chassis only; out to the remote pods on
#   9000 and to the API server on 6443. The API rule is an ipBlock filled in by run.sh from the
#   sentinel, the same way as PoC-5's code-runner dispatcher (../../poc05/platform/network-policy.yaml).
#   Never apply this file without run.sh: the API refuses the sentinel.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remote-run-dispatch
  namespace: poc05-platform
  labels:
    app.kubernetes.io/name: remote-run-dispatch
    app.kubernetes.io/part-of: poc06
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remote-run-dispatch-cards
  namespace: poc05-platform
  labels:
    app.kubernetes.io/name: remote-run-dispatch
    app.kubernetes.io/part-of: poc06
data:
  claude-agent.json: |
    {
      "name": "echo-claude-agent",
      "description": "echo-claude-agent behind the chassis remote lane, one pod per run",
      "version": "0.0.1",
      "supportedInterfaces": [
        {
          "url": "http://set-by-the-front-door.invalid/",
          "protocolBinding": "JSONRPC",
          "protocolVersion": "1.0"
        }
      ],
      "capabilities": {
        "streaming": true
      },
      "skills": [],
