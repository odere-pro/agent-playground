        "text/plain",
        "application/json"
      ]
    }
  typescript.json: |
    {
      "name": "echo-typescript",
      "description": "echo-typescript behind the chassis remote lane, one pod per run",
      "version": "0.0.1",
      "supportedInterfaces": [
        {
          "url": "http://set-by-the-front-door.invalid/",
          "protocolBinding": "JSONRPC",
          "protocolVersion": "1.0"
        }
      ],
      "capabilities": {
        "streaming": true
      },
      "skills": [],
      "defaultInputModes": [
        "text/plain",
        "application/json"
      ],
      "defaultOutputModes": [
        "text/plain",
        "application/json"
      ]
    }
  kagent-adk.json: |
    {
      "name": "kagent_adk",
      "description": "kagent_adk behind the chassis remote lane, one pod per run",
      "version": "0.0.1",
      "supportedInterfaces": [
        {
          "url": "http://set-by-the-front-door.invalid/",
          "protocolBinding": "JSONRPC",
          "protocolVersion": "1.0"
        }
      ],
      "capabilities": {
        "streaming": true
      },
      "skills": [],
      "defaultInputModes": [
        "text/plain",
        "application/json"
      ],
      "defaultOutputModes": [
        "text/plain",
        "application/json"
