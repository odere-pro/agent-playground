# Postgres for LiteLLM's virtual keys and spend (plan section 2.9). Only LiteLLM reaches 5432
# (network-policy.yaml); no egress. The password is the Secret `litellm-db` (seed.sh), read from a
# mounted file (POSTGRES_PASSWORD_FILE), so it is not in the environment either. Data is an
# emptyDir: a pod restart loses every virtual key, so rerun `seed.sh rekey` after one.
# The alpine image's `postgres` user is uid 70, gid 70.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # postgres:17.6-alpine, its multi-arch index digest (T19: docker buildx imagetools).
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          # Small buffers to fit the 128Mi limit (plan section 8); one client, LiteLLM.
          args: [-c, shared_buffers=16MB, -c, max_connections=30]
          env:
            - name: POSTGRES_USER
              value: litellm
            - name: POSTGRES_DB
              value: litellm
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/postgres-auth/password
            # A subdirectory, so initdb creates it with the right owner and mode.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, litellm, -d, litellm, -h, 127.0.0.1]
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: auth
              mountPath: /etc/postgres-auth
              readOnly: true
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: litellm-db
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
