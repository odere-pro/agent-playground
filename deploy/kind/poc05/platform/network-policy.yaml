# poc05-platform: what each platform pod may send and receive (plan section 2.10). The namespace's
# `default-deny` (base/default-deny.yaml) refuses everything else, both ways. Peers are pod labels,
# plus `kubernetes.io/metadata.name` for another namespace. One rule uses an `ipBlock`: the
# dispatcher's egress to the API server endpoint, a `/32` on 6443 (policy `code-runner-dispatch`,
# below). No other rule can reach the metadata service, the Kubernetes API, or a node.
#
# Label scheme. Platform pods: `app.kubernetes.io/name: <service>`. Chassis pods (T13), in
# `poc05-agents`: `agents.platform/role: chassis`; only they reach LiteLLM and Valkey.
# The per-call code-runner pods, in `poc05-tools`: `app.kubernetes.io/name: code-runner`; their
# ingress policy admits only `app.kubernetes.io/name: code-runner-dispatch` from `poc05-platform`.
# LiteLLM reaches the code runner only through the dispatcher.
# `kubectl port-forward` (seed.sh, the tests) enters through the kubelet and needs no rule here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-agents
          podSelector:
            matchLabels:
              agents.platform/role: chassis
      ports:
        - port: 4000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fake-model-server
      ports:
        - port: 8081
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fake-mcp-server
      ports:
        - port: 8082
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: code-runner-dispatch
      ports:
        - port: 8000
          protocol: TCP
---
# The code-runner dispatcher (code-runner-dispatch.yaml): LiteLLM in on 8000; out to the per-call
# sandboxes on 8000 and to the API server on 6443. No DNS.
#
# The API server rule is the one `ipBlock` in PoC-5 (per-call design, section "NetworkPolicy"; a
# recorded B4 exception). kindnet sees the address after the Service rewrite, so the ClusterIP
# does not work: the block is the `kubernetes` EndpointSlice address, as a /32, port 6443 only, no
# `except`. The file in git holds the sentinel; `run.sh` fills it in on every platform apply and
# refuses an empty value, the sentinel, 169.254.0.0/16, and the pod and service ranges of
# cluster.yaml. Never apply this folder with `kubectl apply -k`: the API refuses the sentinel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-runner-dispatch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: code-runner-dispatch
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-tools
          podSelector:
            matchLabels:
              app.kubernetes.io/name: code-runner
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - ipBlock:
            cidr: __API_SERVER_IP__/32
      ports:
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 5432
          protocol: TCP
---
# The H09 fix: an agent pod has no route to the model server; LiteLLM holds the upstream.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fake-model-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fake-model-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8081
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fake-mcp-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fake-mcp-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8082
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-agents
          podSelector:
            matchLabels:
              agents.platform/role: chassis
      ports:
        - port: 6379
          protocol: TCP
---
# MinIO: the one-shot minio-init Job (not in the section 2.10 table: it sets up the bucket, the
# documents, and the users), and `agent-echo` by name, the one chassis that reads its config from
# the store (`config: minio`; security review F10 as amended on 2026-11-07). Not by
# `agents.platform/role: chassis`: the other chassis pods keep `config: memory` and get no edge.
# agent-echo's workload shares the pod's network, so it reaches 9000 too; MinIO's SigV4 refuses it
# (H12, test_poc05_kind_hardreq1.py), a recorded sidecar-lane risk (the blind-spots note).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio-init
      ports:
        - port: 9000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-echo
      ports:
        - port: 9000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-init
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio-init
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - port: 9000
          protocol: TCP
