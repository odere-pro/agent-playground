# MinIO, the agent config store (plan sections 2.11, 2.12, H12). Root credentials from the Secret
# `minio-root` (seed.sh). agent-echo's chassis reads its config document as its own user,
# `chassis-echo`, which may read `agents/echo.yaml` and nothing else (minio-init below). Data is an
# emptyDir: a MinIO restart loses the document and the user. Rerun the Job (delete it, then
# `run.sh apply`) before agent-echo restarts, or its chassis does not start (runbooks).
# Image: the one the PoC-4 scale stack pins by digest (deploy/compose/docker-compose.scale.yaml).
# Exception, owner platform-security: a community build, fake data only; build from source and
# sign before any real data (deploy/compose/SECURITY.md, section 7).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      serviceAccountName: minio
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
          args: [server, /data, --address, ":9000", --certs-dir, /tmp/certs]
          envFrom:
            - secretRef:
                name: minio-root
          env:
            - name: MINIO_BROWSER
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
# One shot, as in the PoC-4 scale stack: the bucket `agent-configs` with versioning; every file in
# the ConfigMap `agent-configs-seed` (platform/agent-configs/, kustomization.yaml) copied to
# agents/<file>; and per store-reading chassis one user and one policy. Today that is agent-echo:
# the user `chassis-echo` (a name, not a secret) with `chassis-echo-read`, `s3:GetObject` on
# `agents/echo.yaml` only (no list, no write, no bucket action; the chassis sets its region, so
# the SDK never asks for the bucket location). The root pair reaches mc only through MC_HOST_local,
# built inside the shell from env, never in argv.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-init
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels:
    app.kubernetes.io/name: minio-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
    spec:
      serviceAccountName: minio-init
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
          envFrom:
            - secretRef:
                name: minio-root
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/mc
            # agent-echo's user: CONFIG_S3_ACCESS_KEY in agents/agent-echo.yaml is the same name.
            - name: ECHO_S3_USER
              value: chassis-echo
            - name: ECHO_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: chassis-echo-minio
                  key: CONFIG_S3_SECRET_KEY
          command:
            - sh
            - -c
            - |
              set -eu
              export MC_HOST_local="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio.poc05-platform.svc.cluster.local:9000"
              i=0
              until mc ready local >/dev/null 2>&1; do
                i=$((i + 1))
                [ "$i" -lt 60 ] || { echo "minio-init: MinIO not ready after 60 s" >&2; exit 1; }
                sleep 1
              done
              mc mb --ignore-existing local/agent-configs
              mc version enable local/agent-configs
              for f in /seed/configs/*; do
                [ -f "$f" ] || continue
                mc cp "$f" "local/agent-configs/agents/$(basename "$f")"
              done
              cat > /tmp/chassis-echo-read.json <<'POLICY'
              {"Version": "2012-10-17", "Statement": [
                {"Effect": "Allow", "Action": ["s3:GetObject"],
                 "Resource": ["arn:aws:s3:::agent-configs/agents/echo.yaml"]}]}
              POLICY
              mc admin policy create local chassis-echo-read /tmp/chassis-echo-read.json
              # Recorded exception (security review F11, accepted): `mc admin user add` takes the
              # pair as arguments. That argv lives in this one-shot pod only, which holds the root
              # key anyway, for a user that reads one document of fake data; the Job is deleted
              # after 600 s. Listed in deploy/compose/SECURITY.md section 7. Revisit: create the
              # user through the admin API from a script that reads the pair from env.
              mc admin user add local "$ECHO_S3_USER" "$ECHO_S3_SECRET_KEY" >/dev/null
              # A rerun finds the policy attached already, and attach then fails: that is fine
              # only when the user's own record names the policy.
              mc admin policy attach local chassis-echo-read --user "$ECHO_S3_USER" >/dev/null 2>&1 ||
                mc admin user info local "$ECHO_S3_USER" --json | grep -q '"chassis-echo-read"' ||
                { echo "minio-init: chassis-echo-read is not attached to $ECHO_S3_USER" >&2; exit 1; }
              echo "minio-init: bucket, documents, and the chassis-echo user are ready"
          # 64Mi was OOM-killed at `mc admin user add` on kind (T19); 128Mi once more within one
          # second of start, on the 10-CPU VM (2026-10-08). One shot, so the peak is brief.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: seed
              mountPath: /seed/configs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Required: without its document agent-echo's chassis does not start, so fail here.
        - name: seed
          configMap:
            name: agent-configs-seed
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
