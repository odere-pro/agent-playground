# code-runner-dispatch: the one MCP server LiteLLM registers as `code_runner`
# (litellm/config.yaml; docs/plans/2026-10-09-poc-05-per-call-sandbox.md). Per call it creates a
# SandboxClaim on the warm pool `code-runner` in poc05-tools, waits for it, calls `run_python` on
# the claimed pod's IP, and deletes the claim. It never runs code itself.
#
# - Same image as the sandboxes (packages/code-runner), started as `code-runner dispatch`. On runc
#   in poc05-platform, like LiteLLM: admission rule 7d refuses a tool-shape pod with a token, and
#   that rule stays strict.
# - Its one credential: a projected service account token (suggested: expirationSeconds 3600) and
#   the cluster CA, in its one container, read-only. The token's rights are `create`, `get`,
#   `delete` on sandboxclaims in poc05-tools only (admission/rbac.yaml, applied by the cluster
#   admin). No model or tool key, no Secret, no env.
# - No DNS: it reaches the API at KUBERNETES_SERVICE_HOST:KUBERNETES_SERVICE_PORT (set for every
#   pod, whatever enableServiceLinks says) and the sandboxes by pod IP. network-policy.yaml allows
#   LiteLLM in on 8000, the sandboxes out on 8000, and the API server endpoint on 6443 (the one
#   ipBlock in PoC-5, filled in by run.sh).
# - /health never calls the API, so a slow API server cannot restart it. suggested: liveness
#   timeoutSeconds 5, failureThreshold 6 (code review 2026-10-09); 128Mi limit (about 70 MiB idle).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-runner-dispatch
  labels:
    app.kubernetes.io/name: code-runner-dispatch
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-runner-dispatch
  labels:
    app.kubernetes.io/name: code-runner-dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: code-runner-dispatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-runner-dispatch
    spec:
      serviceAccountName: code-runner-dispatch
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: code-runner-dispatch
          image: kind.local/agent-platform/code-runner:poc05
          imagePullPolicy: Never
          command: [code-runner]
          args:
            - dispatch
            - --pool
            - code-runner
            - --namespace
            - poc05-tools
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: mcp
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10003
            runAsGroup: 10003
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: code-runner-dispatch
  labels:
    app.kubernetes.io/name: code-runner-dispatch
spec:
  selector:
    app.kubernetes.io/name: code-runner-dispatch
  ports:
    - name: mcp
      port: 8000
      targetPort: 8000
