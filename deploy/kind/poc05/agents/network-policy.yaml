# poc05-agents: what each agent pod may send and receive (plan section 2.10). The namespace's
# `default-deny` (base/default-deny.yaml) refuses everything else, both ways. Peers are pod labels,
# plus `kubernetes.io/metadata.name` for another namespace; no rule uses an `ipBlock`.
#
# Left from the section 2.10 table on purpose:
# - MinIO 9000: the chassis config is the mounted file (`config: memory`), so no chassis needs it.
# - `agent-probe-sidecar`, `chassis-probe-remote`: the probe workload is out of scope for this pass.
# The 8080 rule matters for in-cluster callers only; `kubectl port-forward` enters through the
# kubelet. A policy cannot tell the two containers of agent-echo apart (shared network namespace),
# so the sidecar workload rides the chassis's egress and the services' own auth is the control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-echo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-echo
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - port: 6379
          protocol: TCP
---
# 8091 only from its own remote's pod label (H17, H18).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chassis-echo-remote
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chassis-echo-remote
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-remote
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-echo
      ports:
        - port: 8091
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-remote
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-echo
      ports:
        - port: 9000
          protocol: TCP
