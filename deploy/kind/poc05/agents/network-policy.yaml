# poc05-agents: what each agent pod may send and receive (plan section 2.10). The namespace's
# `default-deny` (base/default-deny.yaml) refuses everything else, both ways. Peers are pod labels,
# plus `kubernetes.io/metadata.name` for another namespace; no rule uses an `ipBlock`.
#
# Left from the section 2.10 table on purpose:
# - MinIO 9000: the chassis config is the mounted file (`config: memory`), so no chassis needs it.
# - `agent-probe-sidecar`, `chassis-probe-remote`: the probe workload is out of scope for this pass.
# The chassis public port 8080 takes only the gateway peer (core review R5a-07): /v1/run takes no
# credential, so an open 8080 let any pod whose own egress is not policed (`default`,
# `kube-system`) drive the agent and spend its LiteLLM key. suggested: the gateway is a pod in
# `agent-platform-system` labeled `agents.platform/role: gateway`; only the cluster admin creates
# pods there (admission/rbac.yaml binds no one in it), and its egress is
# gateway-network-policy.yaml. `kubectl port-forward` enters through the kubelet and needs no
# rule; a chassis calling its own pod IP (the kind tests' /v1/run) never leaves its netns.
# A policy cannot tell the two containers of agent-echo apart (shared network namespace), so the
# sidecar workload rides the chassis's egress and the services' own auth is the control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-echo
  namespace: poc05-agents
  labels:
    app.kubernetes.io/part-of: poc05
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-echo
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-platform-system
          podSelector:
            matchLabels:
              agents.platform/role: gateway
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - port: 6379
          protocol: TCP
---
# 8091 only from its own remote's pod label (H17, H18).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chassis-echo-remote
  namespace: poc05-agents
  labels:
    app.kubernetes.io/part-of: poc05
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chassis-echo-remote
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-platform-system
          podSelector:
            matchLabels:
              agents.platform/role: gateway
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-remote
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-echo
      ports:
        - port: 8091
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-remote
          podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-echo
      ports:
        - port: 9000
          protocol: TCP
