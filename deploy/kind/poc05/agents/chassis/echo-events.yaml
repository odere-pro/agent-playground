# The chassis config for `agent-echo-events` (T25, H11): `agent-echo`'s sidecar lane with one
# change that matters, `events: kafka` and `result_events: true`, so each finished run publishes
# `agents.task.completed.v1` (or `.failed.v1`) to the kind broker with the chassis's SCRAM user.
# That publish is H11's paired control. The only PoC-5 config that names a broker
# (test_poc05_events_agnostic.py).
#
# `model: fake` and `tools: fake`, `state: memory`: this pod needs no LiteLLM key and no Valkey
# password, so its one Secret is `kafka-sasl`. KAFKA_BOOTSTRAP_SERVERS, KAFKA_SECURITY_PROTOCOL,
# KAFKA_SASL_MECHANISM, KAFKA_SASL_USERNAME, and KAFKA_SASL_PASSWORD come from the chassis
# container's env (agent-echo-events.yaml). Mounted read-only at /etc/chassis/config.yaml from the
# ConfigMap chassis-echo-events-config, which `run.sh kafka` makes from this file.
profile: local
agent:
  name: echo-events
  version: 0.0.1
spec:
  trust: trusted
  adapters:
    model: fake
    config: memory
    state: memory
    telemetry: memory
    tools: fake
    events: kafka
  engine:
    connector: sidecar
    url: http://127.0.0.1:9000
  events:
    result_events: true
