# chassis-echo-remote: the remote lane's chassis (plan sections 2.1 to 2.3, 2.10, 2.11). The chassis
# runs alone; its workload is the Sandbox `remote-echo` on gVisor in poc05-remote.
#
# - Public port 8080 on the pod IP. The remote proxy listener on the pod IP, 8091
#   (--remote-proxy-host): the same model proxy and /mcp as loopback, behind the bearer check and
#   `run_required`. The loopback proxy listener (127.0.0.1:8090) is unchanged and unused.
# - `chassis-echo-remote-proxy` is the fixed-ClusterIP Service in front of 8091. The remote pod has
#   no DNS (section 2.10), so it gets this IP as plain env (remote/remote-echo.yaml). suggested:
#   10.96.85.91, inside kind's default Service range 10.96.0.0/16. If it changes, change both files.
# - One replica: the remote listener answers only for a run in flight in this process
#   (`run_required`), so a second replica behind the same Service would answer 403 at random.
# - Secrets, chassis container only: its LiteLLM virtual key, the Valkey password, and REMOTE_TOKEN
#   from `remote-echo-token` (the same value the remote pod holds as CHASSIS_API_TOKEN).
# - The pod's trust label is `untrusted`, the same value as `spec.trust` in its config: the label
#   names the workload this chassis fronts. Admission reads it as a chassis-only pod (no workload
#   image), so rule 2 does not apply.
#
# Not here: `chassis-probe-remote` (the probe workload is out of scope for this pass).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chassis-echo-remote
  labels:
    app.kubernetes.io/name: chassis-echo-remote
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chassis-echo-remote
  labels:
    app.kubernetes.io/name: chassis-echo-remote
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chassis-echo-remote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chassis-echo-remote
        agents.platform/role: chassis
        agents.platform/lane: remote
        agents.platform/trust: untrusted
    spec:
      serviceAccountName: chassis-echo-remote
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 50
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chassis
          image: kind.local/agent-platform/chassis:poc05
          imagePullPolicy: Never
          args:
            - --config
            - /etc/chassis/config.yaml
            - --host
            - $(POD_IP)
            - --port
            - "8080"
            - --remote-proxy-host
            - $(POD_IP)
            - --remote-proxy-port
            - "8091"
            - --startup-wait-s
            - "120"
            - --drain-delay-s
            - "10"
            - --drain-timeout-s
            - "30"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LITELLM_BASE_URL
              value: http://litellm.poc05-platform.svc.cluster.local:4000/v1
            - name: LITELLM_MCP_URL
              value: http://litellm.poc05-platform.svc.cluster.local:4000/mcp/
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chassis-echo-remote-litellm
                  key: LITELLM_API_KEY
            - name: VALKEY_URL
              value: valkey://valkey.poc05-platform.svc.cluster.local:6379/0
            - name: VALKEY_USERNAME
              value: chassis
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: VALKEY_PASSWORD
            - name: REMOTE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-echo-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
            - name: remote-proxy
              containerPort: 8091
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: chassis-tmp
              mountPath: /tmp
            - name: chassis-config
              mountPath: /etc/chassis
              readOnly: true
      volumes:
        - name: chassis-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: chassis-config
          configMap:
            name: chassis-echo-remote-config
---
apiVersion: v1
kind: Service
metadata:
  name: chassis-echo-remote
  labels:
    app.kubernetes.io/name: chassis-echo-remote
spec:
  selector:
    app.kubernetes.io/name: chassis-echo-remote
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# The remote's only way back in. A fixed ClusterIP, since the remote pod has no DNS.
apiVersion: v1
kind: Service
metadata:
  name: chassis-echo-remote-proxy
  labels:
    app.kubernetes.io/name: chassis-echo-remote
spec:
  clusterIP: 10.96.85.91
  selector:
    app.kubernetes.io/name: chassis-echo-remote
  ports:
    - name: remote-proxy
      port: 8091
      targetPort: 8091
