# agent-echo-events: `agent-echo` with a broker (T25, H11; plan section 2.12). Same sidecar lane,
# same images, same hardening (agent-echo.yaml says why each field is there). What differs:
# - The chassis config is chassis/echo-events.yaml: `events: kafka`, `result_events: true`, and
#   fake model and tools, so the pod's one Secret is `kafka-sasl`.
# - `kafka-sasl` (seed.sh kafka) reaches the chassis container only, as KAFKA_SASL_PASSWORD from a
#   secretKeyRef, the way agent-echo's chassis gets VALKEY_PASSWORD. Not a Secret volume: a pod
#   volume can be mounted into any container, so PoC-5 workload pods have none
#   (test_poc05_hardening_static.py). The adapter also reads KAFKA_SASL_PASSWORD_FILE.
# - Its NetworkPolicy (below): ingress 8080, egress DNS and Kafka 9092 only.
# - No `agents.platform/role: chassis` label: LiteLLM and Valkey admit that label, and this pod
#   calls neither, so it would be an edge with one side. Kafka admits this pod by name instead.
#
# H11 runs from this pod's workload container: it shares the chassis's network namespace, so it
# reaches Kafka on 9092 like the chassis does, and the broker must refuse it by credential.
#
# Not in kustomization.yaml (a new pod there needs a row in the hardening table): `run.sh kafka`
# applies it with the ConfigMap made from chassis/echo-events.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-echo-events
  namespace: poc05-agents
  labels:
    app.kubernetes.io/part-of: poc05
    app.kubernetes.io/name: agent-echo-events
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-echo-events
  namespace: poc05-agents
  labels:
    app.kubernetes.io/part-of: poc05
    app.kubernetes.io/name: agent-echo-events
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-echo-events
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-echo-events
        agents.platform/lane: sidecar
        agents.platform/trust: trusted
    spec:
      serviceAccountName: agent-echo-events
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 50
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: chassis
          image: kind.local/agent-platform/chassis:poc05
          imagePullPolicy: Never
          # The native sidecar: an init container that keeps running.
          restartPolicy: Always
          # The image's ENTRYPOINT is `chassis serve`. The public port binds the pod IP, never
          # 0.0.0.0, so loopback carries only the proxies (127.0.0.1:8090, the default).
          args:
            - --config
            - /etc/chassis/config.yaml
            - --host
            - $(POD_IP)
            - --port
            - "8080"
            - --startup-wait-s
            - "120"
            - --drain-delay-s
            - "10"
            - --drain-timeout-s
            - "30"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.poc05-platform.svc.cluster.local:9092
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_PLAINTEXT
            - name: KAFKA_SASL_MECHANISM
              value: SCRAM-SHA-512
            - name: KAFKA_SASL_USERNAME
              value: chassis
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-sasl
                  key: KAFKA_SASL_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          # `/health` is 200 as soon as the proxies are bound; `/ready` is 503 `starting` until
          # the workload answers (up to --startup-wait-s).
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: chassis-tmp
              mountPath: /tmp
            - name: chassis-config
              mountPath: /etc/chassis
              readOnly: true
      containers:
        - name: workload
          image: kind.local/agent-platform/echo-python:poc05
          imagePullPolicy: Never
          # Appended to the image's `workload-a2a serve ... --host $HOST --port $PORT`.
          args: ["--drain-timeout-s", "30"]
          env:
            # The only four variables the workload gets: no key, no Secret.
            - name: HOST
              value: 127.0.0.1
            - name: PORT
              value: "9000"
            - name: CHASSIS_MODEL_URL
              value: http://127.0.0.1:8090/v1
            - name: CHASSIS_TOOL_URL
              value: http://127.0.0.1:8090/mcp
          # The workload listens on 127.0.0.1 only and the kubelet's httpGet goes to the pod IP,
          # so both probes exec a GET on the agent card inside the container.
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/.well-known/agent-card.json', timeout=2).status == 200 else 1)"
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/.well-known/agent-card.json', timeout=2).status == 200 else 1)"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: workload-tmp
              mountPath: /tmp
      volumes:
        # One /tmp per container, memory-backed and capped: a shared writable volume would be a
        # side channel, and a write over the cap fails at the cap (H22).
        - name: chassis-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: workload-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: chassis-config
          configMap:
            name: chassis-echo-events-config
---
apiVersion: v1
kind: Service
metadata:
  name: agent-echo-events
  namespace: poc05-agents
  labels:
    app.kubernetes.io/part-of: poc05
    app.kubernetes.io/name: agent-echo-events
spec:
  selector:
    app.kubernetes.io/name: agent-echo-events
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-echo-events
  namespace: poc05-agents
  labels:
    app.kubernetes.io/part-of: poc05
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-echo-events
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - port: 9092
          protocol: TCP
