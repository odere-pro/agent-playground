# kubernetes-sigs/agent-sandbox v1.0.5, pinned.
#
# upstream-v1.0.5-with-extensions.yaml is the release's `sandbox-with-extensions.yaml`, unmodified
# (gh release download v1.0.5 -R kubernetes-sigs/agent-sandbox -p sandbox-with-extensions.yaml).
# sha256 b150cb058c577c59c42b060ff7f22e31b5311ca80430db98129f1280a0e85970; run.sh checks it before
# apply. It holds the controller (namespace agent-sandbox-system, started with `--extensions`), the
# Sandbox CRD (agents.x-k8s.io/v1beta1), and the extension CRDs SandboxTemplate, SandboxWarmPool,
# and SandboxClaim (extensions.agents.x-k8s.io/v1beta1), for the per-call code runner
# (docs/plans/2026-10-09-poc-05-per-call-sandbox.md). It has no `aggregate-to-` label, so none of
# its ClusterRoles flows into admin, edit, or view. The `agent-sandbox-controller-extensions` role
# writes NetworkPolicies cluster-wide; every PoC-5 template is `Unmanaged`, so it writes none.
#
# Changes, as patches, not edits:
# - the controller image pinned by the digest the spike resolved for tag v1.0.5;
# - the controller gets resources (spike measured 13 MB idle) and a restricted securityContext;
# - agent-sandbox-system enforces the restricted Pod Security Standard like the PoC-5 namespaces.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream-v1.0.5-with-extensions.yaml
images:
  - name: registry.k8s.io/agent-sandbox/agent-sandbox-controller
    digest: sha256:28a9cbdbfd6ac0a4e5c7e9261ace1aa30ee2da681cb640dccdfed98e8dd9d98b
patches:
  - path: controller-patch.yaml
  - target: {kind: Namespace, name: agent-sandbox-system}
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: agent-sandbox-system
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
