# code-runner: the code-execution tool, a fresh gVisor sandbox per call (plan sections 2.8, 2.10,
# 2.11; T15; docs/plans/2026-10-09-poc-05-per-call-sandbox.md). The SandboxTemplate is the pod; the
# SandboxWarmPool keeps two of them started. Per call, the dispatcher in poc05-platform
# (platform/code-runner-dispatch.yaml) creates a SandboxClaim on this pool, calls `run_python` on
# the claimed pod's IP, and deletes the claim, which deletes the pod. LiteLLM registers only the
# dispatcher; nothing else reaches these pods, and they reach nothing (network-policy.yaml).
#
# - The image's entrypoint is `code-runner --host 0.0.0.0 --port 8000 --tmp-root /tmp`; uid:gid
#   10003:10003. It needs no Secret and gets none, and no egress at all.
# - Trust label `trusted`: the image is ours, built from this repo, so admission holds it to the
#   registry prefix (rule 3). The code it runs is not trusted; that is why it runs on gVisor, with
#   no egress, no service account token, and a capped memory-backed /tmp and /dev/shm.
# - No liveness probe: a per-call pod lives seconds, and a restart mid-call must not happen
#   silently. Memory request equals the limit. suggested: 256Mi, /tmp 64Mi, /dev/shm 8Mi.
# - PIDs: the kubelet's podPidsLimit (256, cluster.yaml). Under gVisor each guest process costs
#   about three host pids, so a fork bomb in a snippet ends its own sandbox, not the node (spike,
#   q6), and not another caller's sandbox.
# - The template: `networkPolicyManagement: Unmanaged` (Managed would write a policy that allows
#   internet egress), no env injection, no volume claims, no Service (the dispatcher dials pod IPs).
#   Admission refuses a template that is not set this way (admission/, task 4).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-runner
  labels:
    app.kubernetes.io/name: code-runner
automountServiceAccountToken: false
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: code-runner
  labels:
    app.kubernetes.io/name: code-runner
spec:
  networkPolicyManagement: Unmanaged
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  service: false
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: code-runner
        app.kubernetes.io/part-of: poc05
        agents.platform/trust: trusted
    spec:
      serviceAccountName: code-runner
      automountServiceAccountToken: false
      enableServiceLinks: false
      runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: code-runner
          image: kind.local/agent-platform/code-runner:poc05
          imagePullPolicy: Never
          ports:
            - name: mcp
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10003
            runAsGroup: 10003
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
# suggested: 2 warm sandboxes. One would cold-start every second call in a burst; three add about
# 120 MiB for no test that needs it. An empty pool is slower, not a failure: a claim cold-starts.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: code-runner
  labels:
    app.kubernetes.io/name: code-runner
spec:
  replicas: 2
  sandboxTemplateRef:
    name: code-runner
