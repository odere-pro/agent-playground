# The PoC-5 code runner in poc05-tools (plan sections 2.8, 2.10, 2.11; T15): the Sandbox
# `code-runner` on gVisor, its Service, and its no-egress NetworkPolicy. Apply after the
# agent-sandbox CRD and admission/, and before LiteLLM registers it (bring-up step 9).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: poc05-tools
labels:
  - pairs:
      app.kubernetes.io/part-of: poc05
resources:
  - code-runner.yaml
  - network-policy.yaml
