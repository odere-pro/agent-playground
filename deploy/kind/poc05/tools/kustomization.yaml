# The PoC-5 code runner in poc05-tools (plan sections 2.8, 2.10, 2.11; T15; per-call design
# docs/plans/2026-10-09-poc-05-per-call-sandbox.md): the SandboxTemplate `code-runner` on gVisor,
# its SandboxWarmPool, and the no-egress NetworkPolicy of its per-call pods. Apply after the
# agent-sandbox CRDs (with extensions) and admission/, and before the dispatcher takes calls.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: poc05-tools
labels:
  - pairs:
      app.kubernetes.io/part-of: poc05
resources:
  - code-runner.yaml
  - network-policy.yaml
