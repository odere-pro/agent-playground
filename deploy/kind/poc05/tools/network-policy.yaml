# poc05-tools: the per-call code-runner sandboxes (plan section 2.10; per-call design, section
# "NetworkPolicy"). The MCP port only from the dispatcher in poc05-platform; no egress at all, not
# even DNS: the policy names Egress with no rule. A sandbox cannot reach another sandbox, the
# dispatcher, LiteLLM, or the API. No rule uses an `ipBlock`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: code-runner
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: poc05-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: code-runner-dispatch
      ports:
        - port: 8000
          protocol: TCP
  egress: []
