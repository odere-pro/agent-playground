# The minimum chassis version at admission: rule 9 (ADR-001 item 9; 026 CH-4; the product plan,
# phase A), in its own ValidatingAdmissionPolicy so that its binding can warn while the trust rule
# (policy.yaml, rules 0 to 8) keeps denying. A binding carries one validationActions list for the
# whole policy, so a rule that warns first must stand alone. Checked offline by
# pocs/poc-05-sandboxed/tests/test_poc05_admission_static.py and test_poc05_admission_rule9_static.py,
# on kind by test_poc05_kind_admission.py (fixtures/rule9-chassis-version/).
#
# Apply order (`run.sh admission`): after policy.yaml, before chassis-version-binding.yaml; read
# status.typeChecking first, as for the trust rule. The params are the trust rule's
# (agent-trust-params, params.yaml): supportedChassisTags and supportedChassisDigests.
#
# Rule 9, read the way the node resolves the image. With imageSource pull-never the store is
# loaded by tag: every chassis image carries a tag in supportedChassisTags (the current tag and
# the previous one a service may pin) and no digest. With imageSource digest the runtime pulls
# the digest and ignores a tag beside it: every chassis image carries a digest in
# supportedChassisDigests. An untagged or digest-only reference on kind, and a digest off the
# list on a cloud, break the rule. Signatures (025 H-10) later tie the list to a build.
#
# Warn-first (ADR-001 item 9: "it warns first, then enforces"): chassis-version-binding.yaml binds
# this policy with [Deny, Audit] on kind. When the platform raises the minimum (a new tag list),
# the binding runs [Warn, Audit] for one ring cycle (suggested), so a pod below the minimum is
# admitted with a warning on the request and an audit annotation, then [Deny, Audit]. The library
# chart renders this same policy (deploy/helm/agent-lib/templates/_admission.tpl, with
# admission.chassisVersionAction on the platform's chart); the chart test holds the two equal.
# The variables are the trust rule's, copied: the two policies read the same pod.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-chassis-version
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    # Pods are the last hop for every controller; the workload kinds are matched too, so a bad
    # Deployment or Sandbox is refused at apply time instead of failing to make pods later.
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers", "replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
      # Per-call sandbox plan, "Admission": the template's pod is checked when it is applied, not
      # only when the pool makes its first Sandbox. A SandboxClaim has no pod; the claim rule in
      # extension-policy.yaml covers it.
      - apiGroups: ["extensions.agents.x-k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxtemplates"]
  variables:
    # The pod (or pod template) the object describes.
    - name: template
      expression: >-
        request.kind.kind == 'Pod' ? object :
        request.kind.kind == 'CronJob' ? object.spec.jobTemplate.spec.template :
        request.kind.kind in ['Sandbox', 'SandboxTemplate'] ? object.spec.podTemplate :
        object.spec.template
    - name: spec
      expression: "variables.template.spec"
    - name: containers
      expression: >-
        variables.spec.containers +
        (has(variables.spec.initContainers) ? variables.spec.initContainers : []) +
        (has(variables.spec.ephemeralContainers) ? variables.spec.ephemeralContainers : [])
    - name: images
      expression: "variables.containers.map(c, has(c.image) ? c.image : '')"
    - name: data
      expression: "has(params.data) ? params.data : {}"
    - name: prefix
      expression: "variables.data[?'registryPrefix'].orValue('')"
    - name: imageSource
      expression: "variables.data[?'imageSource'].orValue('')"
    - name: chassisRepository
      expression: "variables.prefix + 'chassis'"
    - name: chassisImages
      expression: >-
        variables.images.filter(i, i == variables.chassisRepository ||
          i.startsWith(variables.chassisRepository + ':') ||
          i.startsWith(variables.chassisRepository + '@'))
    - name: supportedChassisTags
      expression: >-
        variables.data[?'supportedChassisTags'].orValue('').split(',')
        .map(t, t.trim()).filter(t, t != '')
    - name: supportedChassisDigests
      expression: >-
        variables.data[?'supportedChassisDigests'].orValue('').split(',')
        .map(d, d.trim()).filter(d, d != '')
    # The tag of each chassis image: after the last ':' of the reference without its digest, when
    # that ':' comes after the last '/' (a registry port is before it). No tag gives ''.
    - name: chassisTags
      expression: >-
        variables.chassisImages.map(i, i.contains('@') ? i.substring(0, i.indexOf('@')) : i)
        .map(r, r.lastIndexOf(':') > r.lastIndexOf('/') ? r.substring(r.lastIndexOf(':') + 1) : '')
    # The digest of each chassis image, after its '@'; no digest gives ''.
    - name: chassisDigests
      expression: >-
        variables.chassisImages.map(i, i.contains('@') ? i.substring(i.indexOf('@') + 1) : '')
  validations:
    - expression: >-
        variables.imageSource == 'digest'
        ? variables.chassisDigests.all(d, d in variables.supportedChassisDigests)
        : (variables.chassisTags.all(t, t in variables.supportedChassisTags) &&
           variables.chassisDigests.all(d, d == ''))
      message: >-
        trust rule 9: every chassis image must be at or above the minimum chassis version in
        agent-trust-params: a tag in supportedChassisTags and no digest when imageSource is
        pull-never (the store is loaded by tag), or a digest in supportedChassisDigests when
        imageSource is digest (the runtime ignores a tag beside a digest)
      messageExpression: >-
        'trust rule 9: every chassis image must be at or above the minimum chassis version in
        agent-trust-params: a tag in supportedChassisTags and no digest when imageSource is
        pull-never (the store is loaded by tag), or a digest in supportedChassisDigests when
        imageSource is digest (the runtime ignores a tag beside a digest): ' +
        variables.chassisImages.join(', ')
      reason: Forbidden
