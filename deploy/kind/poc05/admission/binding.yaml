# Binds agent-trust-rule to the PoC-5 workload namespaces (the label agents.platform/admission:
# enforce, set in base/namespaces.yaml on poc05-agents, poc05-remote, poc05-tools). Apply it last,
# after params.yaml and a policy that compiled (see policy.yaml). Deny refuses the request; Audit
# also writes the failure to the audit log. Missing params deny every matched request.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-trust-rule
spec:
  policyName: agent-trust-rule
  validationActions: [Deny, Audit]
  paramRef:
    name: agent-trust-params
    namespace: agent-platform-system
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        agents.platform/admission: enforce
