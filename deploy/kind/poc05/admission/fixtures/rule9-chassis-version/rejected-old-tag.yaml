# Rule 9, the minimum chassis version: a chassis tag below the minimum (poc04 is not in supportedChassisTags).
# expect: rejected
# rule: 9
# message: trust rule 9: every chassis image must carry a tag from supportedChassisTags in agent-trust-params, the chassis tags at or above the minimum version; a chassis below it, or pinned by digest alone, is refused
# differs: .spec.initContainers[0].image
apiVersion: v1
kind: Pod
metadata:
  name: admission-rule9
  namespace: poc05-agents
  labels:
    app.kubernetes.io/name: admission-rule9
    agents.platform/trust: trusted
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: chassis
    image: kind.local/agent-platform/chassis:poc04
    imagePullPolicy: Never
    restartPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: &id001
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsUser: 10001
      runAsGroup: 10001
  containers:
  - name: workload
    image: kind.local/agent-platform/echo-python:poc05
    imagePullPolicy: Never
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: *id001
      readOnlyRootFilesystem: true
      runAsUser: 10002
      runAsGroup: 10002
