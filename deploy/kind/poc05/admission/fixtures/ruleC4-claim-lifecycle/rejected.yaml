# Claim rule C4, shutdownPolicy Delete with a shutdownTime: Retain would keep the claim after shutdownTime.
# expect: rejected
# rule: C4
# message: claim rule C4: a SandboxClaim must set lifecycle shutdownPolicy Delete and a shutdownTime
# differs: .spec.lifecycle.shutdownPolicy
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: admission-claim-c4
  namespace: poc05-tools
spec:
  warmPoolRef:
    name: code-runner
  lifecycle:
    shutdownTime: '2030-01-01T00:00:00Z'
    shutdownPolicy: Retain
