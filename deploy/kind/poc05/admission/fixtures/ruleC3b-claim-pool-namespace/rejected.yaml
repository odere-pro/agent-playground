# Claim rule C3, per namespace: a claim in poc05-remote names the code-runner pool of poc05-tools.
# expect: rejected
# rule: C3
# message: claim rule C3: a SandboxClaim may claim only from its namespace's pools: code-runner in poc05-tools, a remote-<engine> pool in poc05-remote
# differs: .spec.warmPoolRef.name
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: admission-claim-c3b
  namespace: poc05-remote
spec:
  warmPoolRef:
    name: code-runner
  lifecycle:
    shutdownTime: '2030-01-01T00:00:00Z'
    shutdownPolicy: Delete
