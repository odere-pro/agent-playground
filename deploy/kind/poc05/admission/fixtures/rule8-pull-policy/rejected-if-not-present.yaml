# Rule 8, images from the cluster store only (review F1): IfNotPresent pulls a tag that was never loaded.
# expect: rejected
# rule: 8
# message: trust rule 8: outside the remote lane every image must come from the cluster image store: imagePullPolicy Never, or an @sha256 digest when imageSource is digest
# differs: .spec.containers[0].imagePullPolicy
apiVersion: v1
kind: Pod
metadata:
  name: admission-rule8
  namespace: poc05-agents
  labels:
    app.kubernetes.io/name: admission-rule8
    agents.platform/trust: trusted
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: chassis
    image: kind.local/agent-platform/chassis:poc05
    imagePullPolicy: Never
    restartPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: &id001
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsUser: 10001
      runAsGroup: 10001
  containers:
  - name: workload
    image: kind.local/agent-platform/echo-python:poc05
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: *id001
      readOnlyRootFilesystem: true
      runAsUser: 10002
      runAsGroup: 10002
