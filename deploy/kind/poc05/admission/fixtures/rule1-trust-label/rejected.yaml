# Rule 1, trust label: no agents.platform/trust label.
# expect: rejected
# rule: 1
# message: trust rule 1: every pod must carry the label agents.platform/trust with trusted or untrusted
# differs: .metadata.labels[agents.platform/trust]
apiVersion: v1
kind: Pod
metadata:
  name: admission-rule1
  namespace: poc05-agents
  labels:
    app.kubernetes.io/name: admission-rule1
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: chassis
    image: kind.local/agent-platform/chassis:poc05
    imagePullPolicy: Never
    restartPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: &id001
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsUser: 10001
      runAsGroup: 10001
  containers:
  - name: workload
    image: kind.local/agent-platform/echo-python:poc05
    imagePullPolicy: Never
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: *id001
      readOnlyRootFilesystem: true
      runAsUser: 10002
      runAsGroup: 10002
