# Rule S1, service type: a NodePort Service opens the chassis port on every node, past the
# gateway-only ingress (R5a-07): the node is the source, not the gateway.
# expect: rejected
# rule: S1
# message: service rule S1: a Service must be type ClusterIP and set no externalIPs, loadBalancerIP, or externalName
# differs: .spec.type
apiVersion: v1
kind: Service
metadata:
  name: admission-rules1-nodeport
  namespace: poc05-agents
  labels:
    app.kubernetes.io/name: admission-rules1-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: agent-echo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
