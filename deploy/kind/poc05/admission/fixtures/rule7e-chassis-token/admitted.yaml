# Rule 7e, the service account token in the chassis only (core review R5a-01): the admitted
# twin, a sidecar pod with automount off whose projected token only the chassis mounts.
# expect: admitted
# rule: 7e
apiVersion: v1
kind: Pod
metadata:
  name: admission-rule7e
  namespace: poc05-agents
  labels:
    app.kubernetes.io/name: admission-rule7e
    agents.platform/trust: trusted
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: chassis
    image: kind.local/agent-platform/chassis:poc05
    imagePullPolicy: Never
    restartPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: &id001
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsUser: 10001
      runAsGroup: 10001
    volumeMounts:
    - name: sa-token
      mountPath: /var/run/secrets/poc05
      readOnly: true
  containers:
  - name: workload
    image: kind.local/agent-platform/echo-python:poc05
    imagePullPolicy: Never
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: *id001
      readOnlyRootFilesystem: true
      runAsUser: 10002
      runAsGroup: 10002
  volumes:
  - name: sa-token
    projected:
      sources:
      - serviceAccountToken:
          audience: poc05-fixture
          expirationSeconds: 3600
          path: token
