# Rule 7b, the chassis role label (review F3): agents.platform/role: chassis on a pod with no chassis image.
# expect: rejected
# rule: 7b
# message: trust rule 7b: only a pod that runs the chassis image may carry agents.platform/role: chassis
# differs: .metadata.labels[agents.platform/role]
apiVersion: v1
kind: Pod
metadata:
  name: admission-rule7b
  namespace: poc05-remote
  labels:
    app.kubernetes.io/name: remote-echo
    agents.platform/lane: remote
    agents.platform/trust: untrusted
    agents.platform/role: chassis
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: workload
    image: ghcr.io/example/third-party-agent:1.0
    env:
    - name: CHASSIS_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: remote-echo-token
          key: token
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsUser: 10002
      runAsGroup: 10002
