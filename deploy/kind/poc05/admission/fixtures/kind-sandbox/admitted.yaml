# An agent-sandbox Sandbox, rule 5: the admitted twin.
# expect: admitted
# rule: 5
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: admission-sandbox
  namespace: poc05-remote
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: remote-echo
        agents.platform/lane: remote
        agents.platform/trust: untrusted
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: workload
        image: ghcr.io/example/third-party-agent:1.0
        env:
        - name: CHASSIS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: remote-echo-token
              key: token
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 10002
          runAsGroup: 10002
