# An agent-sandbox Sandbox, rule 5: the remote pod template has no runtimeClassName.
# expect: rejected
# rule: 5
# message: trust rule 5: a remote workload pod must set runtimeClassName gvisor and automountServiceAccountToken false, and take no Secret but remote-<name>-token
# differs: .spec.podTemplate.spec.runtimeClassName
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: admission-sandbox
  namespace: poc05-remote
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: remote-echo
        agents.platform/lane: remote
        agents.platform/trust: untrusted
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: workload
        image: ghcr.io/example/third-party-agent:1.0
        env:
        - name: CHASSIS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: remote-echo-token
              key: token
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 10002
          runAsGroup: 10002
