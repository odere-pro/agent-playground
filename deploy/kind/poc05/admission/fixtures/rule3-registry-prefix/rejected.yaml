# Rule 3, registry prefix: a third-party workload image next to the chassis.
# expect: rejected
# rule: 3
# message: trust rule 3: outside the remote lane every image must come from the platform registry prefix
# differs: .spec.containers[0].image
apiVersion: v1
kind: Pod
metadata:
  name: admission-rule3
  namespace: poc05-agents
  labels:
    app.kubernetes.io/name: admission-rule3
    agents.platform/trust: trusted
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: chassis
    image: kind.local/agent-platform/chassis:poc05
    imagePullPolicy: Never
    restartPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: &id001
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsUser: 10001
      runAsGroup: 10001
  containers:
  - name: workload
    image: ghcr.io/example/third-party-agent:1.0
    imagePullPolicy: Never
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: *id001
      readOnlyRootFilesystem: true
      runAsUser: 10002
      runAsGroup: 10002
