# Rule 5, the remote pod's shape: a Secret other than a remote-<name>-token.
# expect: rejected
# rule: 5
# message: trust rule 5: a remote workload pod must set runtimeClassName gvisor and automountServiceAccountToken false, and take no Secret but remote-<name>-token
# differs: .spec.containers[0].env[0].valueFrom.secretKeyRef.name
apiVersion: v1
kind: Pod
metadata:
  name: admission-rule5
  namespace: poc05-remote
  labels:
    app.kubernetes.io/name: remote-echo
    agents.platform/lane: remote
    agents.platform/trust: untrusted
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: workload
    image: ghcr.io/example/third-party-agent:1.0
    env:
    - name: CHASSIS_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: chassis-echo-litellm
          key: token
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsUser: 10002
      runAsGroup: 10002
