  name: admission-claim-c2
  namespace: poc05-tools
spec:
  warmPoolRef:
    name: code-runner
  lifecycle:
    shutdownTime: '2030-01-01T00:00:00Z'
    shutdownPolicy: Delete
  additionalPodMetadata:
    labels:
      app.kubernetes.io/name: litellm
