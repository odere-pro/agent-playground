# LiteLLM proxy config, `local` variant. Mounted by docker-compose.local.yaml in place of
# config.yaml. `big-default` is an API model, `local-small` is llama.cpp. Rules: ../SECURITY.md.

model_list:
  - model_name: big-default
    litellm_params:
      # BIG_DEFAULT_MODEL is the provider model, e.g. `openai/gpt-4o-mini` (suggested; from .env).
      model: os.environ/BIG_DEFAULT_MODEL
      api_base: os.environ/OPENAI_API_BASE
      api_key: os.environ/OPENAI_API_KEY
  - model_name: local-small
    litellm_params:
      model: openai/local-small
      api_base: http://llama-cpp:8080/v1
      # llama.cpp has no auth; LiteLLM's OpenAI client still needs a non-empty placeholder.
      api_key: fake

litellm_settings:
  turn_off_message_logging: true
  callbacks: token_log.handler
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
