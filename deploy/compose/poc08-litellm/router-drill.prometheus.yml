# The router drill's Prometheus: scrapes LiteLLM's `prometheus` callback (router-drill.yaml).
# LiteLLM answers `/metrics/` with 401 to no credential (2026-11-13 run), so the scrape sends the
# `prometheus-scrape` virtual key, minted by `router-drill.sh up` into .run/ and mounted read-only.
# No key in this file.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: litellm
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/litellm-scrape.key
    static_configs:
      - targets: ["litellm:4000"]
    # 004 G-2: `user` is in the usage record only, because a `user` label is unbounded. Every
    # label whose name holds `user` (LiteLLM's `end_user`, `user`, `user_email`, ...) is dropped
    # before storage.
    metric_relabel_configs:
      - action: labeldrop
        regex: .*user.*
