# PoC-8 drill Collector (otel/opentelemetry-collector-contrib, the PoC-7 version): the chassis and
# LiteLLM export OTLP/HTTP on 4318; every span goes to Jaeger. Traces only: the chassis runs with
# OTEL_METRICS_EXPORTER=none, and log redaction is PoC-7's stack, not this drill's.
#
# Sampling (014 H-7, ADR-007 item 8): the same `tail_sampling` block as
# ../poc07/otel-collector.yaml, which says why. Error traces are kept at any rate (decided by
# the user, 2026-11-13). stack.sh makes TRACE_SAMPLE_PERCENT from
# TRACE_SAMPLE_RATE (default 1.0, so the drill keeps every trace). Offline check:
# packages/chassis/tests/test_trace_sampling.py.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
  # suggested: the limits. Refuses data before the Collector runs out of memory; first in the
  # traces pipeline (core processor, in the contrib image at v0.163.2).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  # Policies are ORed: a trace is kept when any policy samples it. suggested: decision_wait 45s,
  # above the default run timeout (30 s) plus the SDK batch delay (5 s), so an errored run's
  # `chassis.run` span (it ends last) arrives before the decision; num_traces 50000 held at once.
  tail_sampling:
    decision_wait: 45s
    num_traces: 50000
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: trace-sample-rate
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TRACE_SAMPLE_PERCENT}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/jaeger]
