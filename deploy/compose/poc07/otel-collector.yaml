# PoC-7 OTel Collector (otel/opentelemetry-collector-contrib 0.163.2), exit criterion 1: the same
# spans reach Langfuse and a second OpenTelemetry backend (Jaeger) by exporter config only.
#
# The chassis exports OTLP/HTTP to this Collector on 4318. The traces pipeline fans every span
# out to both exporters. Swapping or adding a backend is an edit to `exporters` and the pipeline
# list here; no code changes.
#
# Receiver auth (review R7-15): the OTLP/HTTP receiver needs `Authorization: Bearer <token>`
# (contrib `bearertokenauth`, keys `token` and `scheme`), else it answers 401. Without it, anyone
# who reaches 4318 would write into Langfuse under the exporter's Basic auth. The token is
# OTLP_CHASSIS_TOKEN, made by stack.sh into .env.poc07 and read here as `${env:...}`, never
# written in this file. Only the chassis gets it (OTEL_EXPORTER_OTLP_HEADERS); a workload gets no
# token, so a workload's own OTLP export is refused here. The health check on 13133 needs none.
#
# Langfuse: OTLP/HTTP at /api/public/otel (the exporter appends /v1/traces), HTTP Basic auth
# `public:secret`, base64 in LANGFUSE_AUTH (made by stack.sh, never in this file). Langfuse v4
# processes OTLP in real time only with `x-langfuse-ingestion-version: 4` (langfuse 5.0.4,
# langfuse/api/opentelemetry/raw_client.py).
#
# Logs: the chassis redacts its own logs with regexes only (emails, phones, ids). Workload logs
# never pass through the chassis, so this pipeline masks the same ADR-008 entity set by regex
# (PoC-8, suggested: the patterns): secrets first (R1-07: PEM private keys, Bearer and Basic
# values, vendor key shapes, URL userinfo, `password=`-style assignments, all as `<SECRET>`), then
# emails, IBANs, card numbers, US SSNs, and phone numbers last, so a card number or an IBAN is
# masked whole. The tokens are the chassis's (`chassis.redaction`). The secret rules are RE2-safe
# copies of the chassis's. RE2 has no lookbehind, lookahead, backreference, or conditional, so:
# the left edge is `\\b`, and an assignment key may follow up to 40 name characters (as in
# `access_token`); Bearer and Basic values need 16 characters; a PEM body is `[^-]*`; a bare
# `token` takes no suffix (so `tokens: 5` and `token_count` pass); and a whole match (key and
# value, or `scheme://user:pass@`) becomes `<SECRET>`. OTTL strings take Go escapes, so a regex
# backslash is written `\\` (the OTTL docs' `\\d`).
# Cards and phones (R1-04): the phone rule needs a leading `+` or separators, so a bare digit run
# stays, as in the chassis. RE2 cannot run the chassis's Luhn check, so a card-shaped run is
# masked even when its checksum fails. The chassis's kept shapes (ISO dates, IPv4, versions) need
# no exception here: the phone rule's `3-3-4` and `+` forms never match them.
# Named-entity redaction (names, places) is not done here: it needs a Presidio call or a custom
# processor. The patterns hold no `$`, since the Collector expands `$` in its config.
# Offline check: packages/chassis/tests/test_collector_log_redaction.py.
#
# Spans: `transform/redact_spans` masks span and span-event attributes with the same rules, and
# keeps the chassis's id keys as they are. Offline check: test_poc07_stack_static.py.
#
# Sampling (014 H-7, ADR-007 item 8): a Collector policy, so one decision covers the chassis, the
# workload, and LiteLLM. The SDKs export every span. `tail_sampling` runs first in the traces
# pipeline. Its rate is `trace_sample_rate`: stack.sh turns TRACE_SAMPLE_RATE (0 to 1, default
# 1.0) into TRACE_SAMPLE_PERCENT with ../trace_sample_percent.py, the one conversion. suggested:
# a trace with an error span is kept at any rate, and the decision waits 10 s for late spans.
# The block is the same in ../poc08-litellm/otel-collector.yaml. The processor ships in the
# contrib image (manifest at v0.163.2), not in the core one. Offline check:
# packages/chassis/tests/test_trace_sampling.py.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth:
    scheme: Bearer
    token: ${env:OTLP_CHASSIS_TOKEN}

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  batch:
    timeout: 1s
  # Policies are ORed: a trace is kept when any policy samples it.
  tail_sampling:
    decision_wait: 10s
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: trace-sample-rate
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TRACE_SAMPLE_PERCENT}
  # Spans: the same attribute rules as the logs pipeline below, on span and span-event attributes.
  # Workload spans never pass the chassis's own redaction. Keep both lists equal:
  # test_poc07_stack_static.py checks it. The id keys (`ID_KEYS` in chassis.adapters.otel) are
  # saved first and put back last, so an id is never masked, as in the chassis.
  transform/redact_spans:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(cache["a2a.task_id"], attributes["a2a.task_id"]) where attributes["a2a.task_id"] != nil
          - set(cache["agent"], attributes["agent"]) where attributes["agent"] != nil
          - set(cache["format"], attributes["format"]) where attributes["format"] != nil
          - set(cache["interface"], attributes["interface"]) where attributes["interface"] != nil
          - set(cache["lane"], attributes["lane"]) where attributes["lane"] != nil
          - set(cache["request_id"], attributes["request_id"]) where attributes["request_id"] != nil
          - set(cache["route"], attributes["route"]) where attributes["route"] != nil
          - set(cache["session.id"], attributes["session.id"]) where attributes["session.id"] != nil
          - set(cache["span_id"], attributes["span_id"]) where attributes["span_id"] != nil
          - set(cache["task"], attributes["task"]) where attributes["task"] != nil
          - set(cache["tool"], attributes["tool"]) where attributes["tool"] != nil
          - set(cache["trace_id"], attributes["trace_id"]) where attributes["trace_id"] != nil
          - set(cache["user.id"], attributes["user.id"]) where attributes["user.id"] != nil
          - replace_all_patterns(attributes, "value", "-----BEGIN [A-Z0-9 ]{0,40}PRIVATE KEY-----[^-]*(-----END [A-Z0-9 ]{0,40}PRIVATE KEY-----)?", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b(?i:bearer)( *[:] *| +|%20)[A-Za-z0-9._~+/-]{16,}=*", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b(?i:basic) +[A-Za-z0-9+/]{16,}={0,2}", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b(sk-[A-Za-z0-9_-]{8,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[bpars]-[A-Za-z0-9-]{10,}|glpat-[A-Za-z0-9_-]{20,}|(AKIA|ASIA)[A-Z0-9]{16}\\b|AIza[A-Za-z0-9_-]{35}|eyJ[A-Za-z0-9_-]{5,}[.][A-Za-z0-9_-]{2,}[.][A-Za-z0-9_-]{2,})", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b[A-Za-z][A-Za-z0-9+.-]*://[^\\s:/@]*:[^\\s/@]+@", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b[A-Za-z0-9_-]{0,40}?((?i:password|passwd|pwd|secret|credentials?|(api|access|private|master)[_-]?key)[A-Za-z0-9_-]{0,40}|(?i:token))[\"']?[ \\t]*[=:][ \\t]*(\"[^\"\\n]{1,256}\"|'[^'\\n]{1,256}'|[^\\s\"',;&(){}\\[\\]<>][^\\s\"',;&)}\\]>]*)", "<SECRET>")
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}", "<EMAIL_ADDRESS>")
          - replace_all_patterns(attributes, "value", "[A-Z]{2}[0-9]{2}( ?[A-Z0-9]{4}){2,7}( ?[A-Z0-9]{1,4})?", "<IBAN_CODE>")
          - replace_all_patterns(attributes, "value", "[0-9]{4}([ -]?[0-9]{4}){2}[ -]?[0-9]{1,7}", "<CREDIT_CARD>")
          - replace_all_patterns(attributes, "value", "[0-9]{3}-[0-9]{2}-[0-9]{4}", "<US_SSN>")
          - replace_all_patterns(attributes, "value", "([+][0-9][0-9 ().-]{7,}[0-9]|[0-9]{3}[-. ][0-9]{3}[-. ][0-9]{4})", "<PHONE_NUMBER>")
          - set(attributes["a2a.task_id"], cache["a2a.task_id"]) where cache["a2a.task_id"] != nil
          - set(attributes["agent"], cache["agent"]) where cache["agent"] != nil
          - set(attributes["format"], cache["format"]) where cache["format"] != nil
          - set(attributes["interface"], cache["interface"]) where cache["interface"] != nil
          - set(attributes["lane"], cache["lane"]) where cache["lane"] != nil
          - set(attributes["request_id"], cache["request_id"]) where cache["request_id"] != nil
          - set(attributes["route"], cache["route"]) where cache["route"] != nil
          - set(attributes["session.id"], cache["session.id"]) where cache["session.id"] != nil
          - set(attributes["span_id"], cache["span_id"]) where cache["span_id"] != nil
          - set(attributes["task"], cache["task"]) where cache["task"] != nil
          - set(attributes["tool"], cache["tool"]) where cache["tool"] != nil
          - set(attributes["trace_id"], cache["trace_id"]) where cache["trace_id"] != nil
          - set(attributes["user.id"], cache["user.id"]) where cache["user.id"] != nil
      - context: spanevent
        statements:
          - replace_all_patterns(attributes, "value", "-----BEGIN [A-Z0-9 ]{0,40}PRIVATE KEY-----[^-]*(-----END [A-Z0-9 ]{0,40}PRIVATE KEY-----)?", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b(?i:bearer)( *[:] *| +|%20)[A-Za-z0-9._~+/-]{16,}=*", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b(?i:basic) +[A-Za-z0-9+/]{16,}={0,2}", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b(sk-[A-Za-z0-9_-]{8,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[bpars]-[A-Za-z0-9-]{10,}|glpat-[A-Za-z0-9_-]{20,}|(AKIA|ASIA)[A-Z0-9]{16}\\b|AIza[A-Za-z0-9_-]{35}|eyJ[A-Za-z0-9_-]{5,}[.][A-Za-z0-9_-]{2,}[.][A-Za-z0-9_-]{2,})", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b[A-Za-z][A-Za-z0-9+.-]*://[^\\s:/@]*:[^\\s/@]+@", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b[A-Za-z0-9_-]{0,40}?((?i:password|passwd|pwd|secret|credentials?|(api|access|private|master)[_-]?key)[A-Za-z0-9_-]{0,40}|(?i:token))[\"']?[ \\t]*[=:][ \\t]*(\"[^\"\\n]{1,256}\"|'[^'\\n]{1,256}'|[^\\s\"',;&(){}\\[\\]<>][^\\s\"',;&)}\\]>]*)", "<SECRET>")
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}", "<EMAIL_ADDRESS>")
          - replace_all_patterns(attributes, "value", "[A-Z]{2}[0-9]{2}( ?[A-Z0-9]{4}){2,7}( ?[A-Z0-9]{1,4})?", "<IBAN_CODE>")
          - replace_all_patterns(attributes, "value", "[0-9]{4}([ -]?[0-9]{4}){2}[ -]?[0-9]{1,7}", "<CREDIT_CARD>")
          - replace_all_patterns(attributes, "value", "[0-9]{3}-[0-9]{2}-[0-9]{4}", "<US_SSN>")
          - replace_all_patterns(attributes, "value", "([+][0-9][0-9 ().-]{7,}[0-9]|[0-9]{3}[-. ][0-9]{3}[-. ][0-9]{4})", "<PHONE_NUMBER>")
  transform/redact:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "-----BEGIN [A-Z0-9 ]{0,40}PRIVATE KEY-----[^-]*(-----END [A-Z0-9 ]{0,40}PRIVATE KEY-----)?", "<SECRET>")
          - replace_pattern(body, "\\b(?i:bearer)( *[:] *| +|%20)[A-Za-z0-9._~+/-]{16,}=*", "<SECRET>")
          - replace_pattern(body, "\\b(?i:basic) +[A-Za-z0-9+/]{16,}={0,2}", "<SECRET>")
          - replace_pattern(body, "\\b(sk-[A-Za-z0-9_-]{8,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[bpars]-[A-Za-z0-9-]{10,}|glpat-[A-Za-z0-9_-]{20,}|(AKIA|ASIA)[A-Z0-9]{16}\\b|AIza[A-Za-z0-9_-]{35}|eyJ[A-Za-z0-9_-]{5,}[.][A-Za-z0-9_-]{2,}[.][A-Za-z0-9_-]{2,})", "<SECRET>")
          - replace_pattern(body, "\\b[A-Za-z][A-Za-z0-9+.-]*://[^\\s:/@]*:[^\\s/@]+@", "<SECRET>")
          - replace_pattern(body, "\\b[A-Za-z0-9_-]{0,40}?((?i:password|passwd|pwd|secret|credentials?|(api|access|private|master)[_-]?key)[A-Za-z0-9_-]{0,40}|(?i:token))[\"']?[ \\t]*[=:][ \\t]*(\"[^\"\\n]{1,256}\"|'[^'\\n]{1,256}'|[^\\s\"',;&(){}\\[\\]<>][^\\s\"',;&)}\\]>]*)", "<SECRET>")
          - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}", "<EMAIL_ADDRESS>")
          - replace_pattern(body, "[A-Z]{2}[0-9]{2}( ?[A-Z0-9]{4}){2,7}( ?[A-Z0-9]{1,4})?", "<IBAN_CODE>")
          - replace_pattern(body, "[0-9]{4}([ -]?[0-9]{4}){2}[ -]?[0-9]{1,7}", "<CREDIT_CARD>")
          - replace_pattern(body, "[0-9]{3}-[0-9]{2}-[0-9]{4}", "<US_SSN>")
          - replace_pattern(body, "([+][0-9][0-9 ().-]{7,}[0-9]|[0-9]{3}[-. ][0-9]{3}[-. ][0-9]{4})", "<PHONE_NUMBER>")
          - replace_all_patterns(attributes, "value", "-----BEGIN [A-Z0-9 ]{0,40}PRIVATE KEY-----[^-]*(-----END [A-Z0-9 ]{0,40}PRIVATE KEY-----)?", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b(?i:bearer)( *[:] *| +|%20)[A-Za-z0-9._~+/-]{16,}=*", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b(?i:basic) +[A-Za-z0-9+/]{16,}={0,2}", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b(sk-[A-Za-z0-9_-]{8,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[bpars]-[A-Za-z0-9-]{10,}|glpat-[A-Za-z0-9_-]{20,}|(AKIA|ASIA)[A-Z0-9]{16}\\b|AIza[A-Za-z0-9_-]{35}|eyJ[A-Za-z0-9_-]{5,}[.][A-Za-z0-9_-]{2,}[.][A-Za-z0-9_-]{2,})", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b[A-Za-z][A-Za-z0-9+.-]*://[^\\s:/@]*:[^\\s/@]+@", "<SECRET>")
          - replace_all_patterns(attributes, "value", "\\b[A-Za-z0-9_-]{0,40}?((?i:password|passwd|pwd|secret|credentials?|(api|access|private|master)[_-]?key)[A-Za-z0-9_-]{0,40}|(?i:token))[\"']?[ \\t]*[=:][ \\t]*(\"[^\"\\n]{1,256}\"|'[^'\\n]{1,256}'|[^\\s\"',;&(){}\\[\\]<>][^\\s\"',;&)}\\]>]*)", "<SECRET>")
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}", "<EMAIL_ADDRESS>")
          - replace_all_patterns(attributes, "value", "[A-Z]{2}[0-9]{2}( ?[A-Z0-9]{4}){2,7}( ?[A-Z0-9]{1,4})?", "<IBAN_CODE>")
          - replace_all_patterns(attributes, "value", "[0-9]{4}([ -]?[0-9]{4}){2}[ -]?[0-9]{1,7}", "<CREDIT_CARD>")
          - replace_all_patterns(attributes, "value", "[0-9]{3}-[0-9]{2}-[0-9]{4}", "<US_SSN>")
          - replace_all_patterns(attributes, "value", "([+][0-9][0-9 ().-]{7,}[0-9]|[0-9]{3}[-. ][0-9]{3}[-. ][0-9]{4})", "<PHONE_NUMBER>")

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: Basic ${env:LANGFUSE_AUTH}
      x-langfuse-ingestion-version: "4"
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # suggested: the logs backend is a PoC-8 pick; until then redacted logs go to the Collector's
  # own output at basic verbosity (counts only, no bodies).
  debug/logs:
    verbosity: basic

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, transform/redact_spans, batch]
      exporters: [otlphttp/langfuse, otlp/jaeger]
    logs:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [debug/logs]
