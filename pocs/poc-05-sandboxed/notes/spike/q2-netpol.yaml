# Q2: NetworkPolicy on kind's default CNI (kindnet ships kube-network-policies).
# Namespace np: a server, a client the policy allows, a client it does not, and a gVisor client.
# Policies: default-deny ingress; allow ingress to the server only from role=client.
apiVersion: v1
kind: Namespace
metadata:
  name: np
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: np
  labels: {app: server}
spec:
  containers:
    - name: c
      image: busybox:1.37
      command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: np
spec:
  selector: {app: server}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed
  namespace: np
  labels: {role: client}
spec:
  containers:
    - {name: c, image: "busybox:1.37", command: ["sleep", "3600"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: denied
  namespace: np
  labels: {role: other}
spec:
  containers:
    - {name: c, image: "busybox:1.37", command: ["sleep", "3600"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: gv-denied
  namespace: np
  labels: {role: other}
spec:
  runtimeClassName: gvisor
  containers:
    - {name: c, image: "busybox:1.37", command: ["sleep", "3600"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: gv-allowed
  namespace: np
  labels: {role: client}
spec:
  runtimeClassName: gvisor
  containers:
    - {name: c, image: "busybox:1.37", command: ["sleep", "3600"]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: np
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-server
  namespace: np
spec:
  podSelector: {matchLabels: {app: server}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {role: client}}}]
      ports: [{port: 8080, protocol: TCP}]
