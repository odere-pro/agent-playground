# Q2b: egress policy for an untrusted pod. Allows DNS and the cluster, blocks the metadata IP,
# the API server ClusterIP, and the node IP (the API server endpoint on kind).
# Values are this spike cluster's: node IP 172.25.0.2 (API server endpoint :6443), ClusterIP 10.96.0.1.
apiVersion: v1
kind: Pod
metadata:
  name: egress-runc
  namespace: np
  labels: {role: client, egress: locked}
spec:
  containers:
    - {name: c, image: "busybox:1.37", command: ["sleep", "3600"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: egress-gvisor
  namespace: np
  labels: {role: client, egress: locked}
spec:
  runtimeClassName: gvisor
  containers:
    - {name: c, image: "busybox:1.37", command: ["sleep", "3600"]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-locked
  namespace: np
spec:
  podSelector: {matchLabels: {egress: locked}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
              - 10.96.0.1/32
              - 172.25.0.2/32
