# The allowed NetworkPolicy edges of PoC-5 as data: plan section 2.10 (the pod-by-pod table),
# where it differs the manifests under deploy/kind/poc05 win. test_poc05_netpol_static.py computes
# the edges from the policies and requires equality with this file, both ways: an edge the
# manifests add or drop fails the test until this file says so.
#
# Not covered: the probe pods the plan table lists (`agent-probe-sidecar`, `chassis-probe-remote`,
# `remote-probe`) are not built in this pass, so they have no row. Add rows when they exist.
#
# Differences from the plan table (the manifests win; each is a decision for the orchestrator):
#   - MinIO 9000 is not in any chassis egress, and minio's ingress does not take chassis pods. No
#     chassis uses `config: s3` in PoC-5 (security review F10). minio takes only the one-shot
#     `minio-init` Job, which is not in the plan table.
#   - Kafka (deferred pass) has no row.
#   - fake-mcp-server is port 8082 and code-runner is port 8000 (the table says "its port").
#   - 8080 ingress on the two chassis pods is a rule with a port and no `from`: any source, as the
#     table says ("from any source"). It is the only peerless rule, and it is ingress.
#   - The smoke pair (`poc05-smoke`, `run.sh smoke`) is not in the table.
#
# Edge format. A peer is {ns, labels}; labels are matchLabels of the podSelector, `{}` means no
# pod selector (all pods). `src: any` means a rule with ports and no `from`.
# Ports are PROTO/NUMBER.

# Pods the policies select that no manifest under deploy/kind/poc05 defines.
external_pods:
  - {ns: kube-system, labels: {k8s-app: kube-dns}}

# DNS (kube-dns, 53) is allowed for these pods only (app.kubernetes.io/name). The remote sandbox
# (`remote-echo`) and the code runner have none.
dns_allowed:
  - agent-echo
  - chassis-echo-remote
  - litellm
  - minio-init

egress:
  - src: {ns: poc05-agents, labels: {app.kubernetes.io/name: agent-echo}}
    dst: {ns: kube-system, labels: {k8s-app: kube-dns}}
    ports: [UDP/53, TCP/53]
  - src: {ns: poc05-agents, labels: {app.kubernetes.io/name: agent-echo}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    ports: [TCP/4000]
  - src: {ns: poc05-agents, labels: {app.kubernetes.io/name: agent-echo}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: valkey}}
    ports: [TCP/6379]

  - src: {ns: poc05-agents, labels: {app.kubernetes.io/name: chassis-echo-remote}}
    dst: {ns: kube-system, labels: {k8s-app: kube-dns}}
    ports: [UDP/53, TCP/53]
  - src: {ns: poc05-agents, labels: {app.kubernetes.io/name: chassis-echo-remote}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    ports: [TCP/4000]
  - src: {ns: poc05-agents, labels: {app.kubernetes.io/name: chassis-echo-remote}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: valkey}}
    ports: [TCP/6379]
  - src: {ns: poc05-agents, labels: {app.kubernetes.io/name: chassis-echo-remote}}
    dst: {ns: poc05-remote, labels: {app.kubernetes.io/name: remote-echo}}
    ports: [TCP/9000]

  # The remote sandbox: its chassis's remote listener, nothing else, no DNS.
  - src: {ns: poc05-remote, labels: {app.kubernetes.io/name: remote-echo}}
    dst: {ns: poc05-agents, labels: {app.kubernetes.io/name: chassis-echo-remote}}
    ports: [TCP/8091]

  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    dst: {ns: kube-system, labels: {k8s-app: kube-dns}}
    ports: [UDP/53, TCP/53]
  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: postgres}}
    ports: [TCP/5432]
  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: fake-model-server}}
    ports: [TCP/8081]
  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: fake-mcp-server}}
    ports: [TCP/8082]
  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    dst: {ns: poc05-tools, labels: {app.kubernetes.io/name: code-runner}}
    ports: [TCP/8000]

  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: minio-init}}
    dst: {ns: kube-system, labels: {k8s-app: kube-dns}}
    ports: [UDP/53, TCP/53]
  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: minio-init}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: minio}}
    ports: [TCP/9000]

  - src: {ns: poc05-smoke, labels: {agents.platform/smoke-role: client}}
    dst: {ns: poc05-smoke, labels: {agents.platform/smoke-role: server}}
    ports: [TCP/8080]

ingress:
  - src: any
    dst: {ns: poc05-agents, labels: {app.kubernetes.io/name: agent-echo}}
    ports: [TCP/8080]
  - src: any
    dst: {ns: poc05-agents, labels: {app.kubernetes.io/name: chassis-echo-remote}}
    ports: [TCP/8080]
  # 8091 only from its own remote's pod label.
  - src: {ns: poc05-remote, labels: {app.kubernetes.io/name: remote-echo}}
    dst: {ns: poc05-agents, labels: {app.kubernetes.io/name: chassis-echo-remote}}
    ports: [TCP/8091]

  # 9000 only from its own chassis pod's label.
  - src: {ns: poc05-agents, labels: {app.kubernetes.io/name: chassis-echo-remote}}
    dst: {ns: poc05-remote, labels: {app.kubernetes.io/name: remote-echo}}
    ports: [TCP/9000]

  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    dst: {ns: poc05-tools, labels: {app.kubernetes.io/name: code-runner}}
    ports: [TCP/8000]

  - src: {ns: poc05-agents, labels: {agents.platform/role: chassis}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    ports: [TCP/4000]
  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: postgres}}
    ports: [TCP/5432]
  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: fake-model-server}}
    ports: [TCP/8081]
  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: litellm}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: fake-mcp-server}}
    ports: [TCP/8082]
  - src: {ns: poc05-agents, labels: {agents.platform/role: chassis}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: valkey}}
    ports: [TCP/6379]
  - src: {ns: poc05-platform, labels: {app.kubernetes.io/name: minio-init}}
    dst: {ns: poc05-platform, labels: {app.kubernetes.io/name: minio}}
    ports: [TCP/9000]

  - src: {ns: poc05-smoke, labels: {agents.platform/smoke-role: client}}
    dst: {ns: poc05-smoke, labels: {agents.platform/smoke-role: server}}
    ports: [TCP/8080]
