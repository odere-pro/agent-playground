# PoC-4 scale stack, `sidecar` lane: the bootstrap file every chassis-N in
# deploy/compose/docker-compose.scale.yaml reads (`chassis serve --config`). It names the profile,
# the agent, the adapters, and the engine, so the chassis knows how to reach the store. The agent
# config document itself is the same file, seeded by `minio-init` to
# s3://agent-configs/agents/echo.yaml (plan, section 3). Every value that reaches a service comes
# from the container env: LITELLM_BASE_URL, VALKEY_URL and VALKEY_PASSWORD, the CONFIG_S3_* set.
# No key here: the fake model server needs none, and the rest are generated by scale.sh.
profile: local
agent:
  name: echo
  version: 0.0.1
spec:
  adapters:
    # Straight to the fake model server, no LiteLLM in the measured path (plan, 8a).
    model: litellm
    config: minio
    # Shared by every replica: the idempotency cache and its claims (plan, sections 1 and 4).
    state: valkey
    telemetry: memory
    tools: fake
    events: none
  engine:
    connector: sidecar
    # The workload in the same network namespace (`network_mode: service:chassis-N`).
    url: http://127.0.0.1:9000
  model:
    # The fake model server answers any model name.
    route: big-default
  prompt:
    version: simplifier-v1
  limits:
    max_tokens_max: 4000
