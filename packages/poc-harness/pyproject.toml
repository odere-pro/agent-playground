[project]
name = "poc-harness"
version = "0.1.0"
description = "Test harness code that more than one PoC folder uses: apps, lanes, sockets, drills."
requires-python = ">=3.12,<3.13"
dependencies = [
  "chassis",
  "chassis-contracts",
  "fake-model-server",
  "fake-mcp-server",
  "workload-a2a",
  "httpx>=0.28",
  "httpx2>=2.13.1,<3",
  "jsonschema>=4.26",
  "pytest>=8.4",
  "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "poc_harness"
