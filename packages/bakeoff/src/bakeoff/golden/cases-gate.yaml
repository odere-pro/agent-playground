    task: lookup
    input: "lookup: Define workload and expand A2A."
    expect:
      contains: ["agent code", "Agent-to-Agent"]
      tool_calls:
        - { name: glossary_lookup, arguments: { term: workload } }
        - { name: acronym_expand, arguments: { acronym: A2A } }
    rubric: "The answer defines a workload from the glossary and expands A2A, using only what the tools returned."
    reference: "A workload is the agent code that runs behind the chassis. A2A stands for Agent-to-Agent."
    label: pass
  - id: g48
    task: lookup
    input: "lookup: Define quasar."
    expect:
      contains: ["no entry"]
      tool_calls:
        - { name: glossary_lookup, arguments: { term: quasar } }
    rubric: "The answer says the glossary has no entry for quasar and invents no definition."
    reference: "The glossary has no entry for quasar."
    label: pass
  - id: g49
    task: lookup
    input: "lookup: Expand GPU."
    expect:
      contains: ["no entry"]
      tool_calls:
        - { name: acronym_expand, arguments: { acronym: GPU } }
    rubric: "The answer says the acronym list has no entry for GPU and invents no expansion."
    reference: "The acronym list has no entry for GPU."
    label: pass
  - id: g50
    task: lookup
    input: "lookup: What does LiteLLM do?"
    expect:
      contains: ["model router"]
      tool_calls:
        - { name: glossary_lookup, arguments: { term: LiteLLM } }
    model:
      calls:
        - { name: glossary_lookup, arguments: { term: LiteLM } }
    rubric: "The answer defines LiteLLM from the glossary, using only what the tool returned."
    reference: "I could not find LiteLM in the glossary."
    label: fail
    note: "Calls the tool with a typo (LiteLM), so it finds nothing."
