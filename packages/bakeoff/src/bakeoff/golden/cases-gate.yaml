    reference: "MCP is the Model Context Protocol, the protocol the chassis uses to serve tools."
    label: pass
  - id: g46
    task: lookup
    input: "lookup: What is the chassis?"
    expect:
      contains: ["holds keys", "traces"]
      tool_calls:
        - { name: glossary_lookup, arguments: { term: chassis } }
    rubric: "The answer defines the chassis from the glossary, using only what the tool returned."
    reference: "The chassis is the service around a workload. It holds keys, calls models and tools, and traces."
    label: pass
