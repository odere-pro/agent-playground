# The fake profile: no network, no keys. `chassis serve --config packages/chassis/configs/fake.yaml`
# The plain-Python simplifier runs in the `inprocess` lane over A2A in memory; its model call goes
# through the chassis proxy to the scripted fake model.
profile: fake
agent:
  name: echo
  version: 0.0.1
spec:
  # Merged over the `fake` profile defaults per field; these are the defaults, named for clarity.
  # The lane is not here: it is `spec.engine.connector` (contract v1, decision 2).
  adapters:
    model: fake
    config: memory
    telemetry: memory
  engine:
    # Named on purpose: `connector` defaults to `sidecar` (ADR-001 item 4).
    connector: inprocess
    handle: echo_python:handle
  model:
    route: fake-route
  prompt:
    version: simplifier-v1
