# The local profile: the real model adapter against the LiteLLM router in deploy/compose.
# Mounted at /etc/chassis/config.yaml by the Compose stack; LITELLM_BASE_URL and LITELLM_API_KEY
# come from the container env. `chassis serve --config packages/chassis/configs/local.yaml`
profile: local
agent:
  name: echo
  version: 0.0.1
spec:
  # Merged over the `local` profile defaults per field. Those name `minio`, `otel`, `mcp`, and
  # `valkey`, which need services this stack does not run, so the overrides below are required.
  adapters:
    model: litellm
    config: memory
    telemetry: memory
    tools: fake
    # PoC-4: `local` defaults to `valkey`; this stack has no Valkey, so one store per process.
    state: memory
  engine:
    # The PoC-1 Compose config: the workload runs in the chassis process, `inprocess`, named
    # because `connector` defaults to `sidecar`. The PoC-2 Compose config is configs/sidecar.yaml,
    # used with the overlay deploy/compose/docker-compose.sidecar.yaml.
    connector: inprocess
    handle: echo_python:handle
  model:
    route: big-default
  prompt:
    version: simplifier-v1
