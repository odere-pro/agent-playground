[project]
name = "chassis"
version = "0.1.0"
description = "The service chassis: core, ports, fakes, adapters, and the JSON Schemas of the contract"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.28",
  "a2a-sdk[http-server]>=1.2,<2",
  "pyyaml>=6.0",
]

[project.scripts]
chassis = "chassis.server.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chassis"
