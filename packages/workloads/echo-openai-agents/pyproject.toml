[project]
name = "echo-openai-agents"
version = "0.1.0"
description = "PoC-6: the simplifier as an OpenAI Agents SDK agent, handle(input, ctx) in the wire form, served by workload-a2a, no chassis dependency, no key"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai-agents==0.23.1",
  "openai",
  "mcp",
  "httpx2",
  "workload-a2a",
]

[dependency-groups]
dev = ["fake-mcp-server", "fake-model-server", "fastmcp"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "echo_openai_agents"
