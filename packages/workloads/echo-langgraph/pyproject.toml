[project]
name = "echo-langgraph"
version = "0.1.0"
description = "The simplifier as a LangGraph graph: handle(input, ctx) in the wire form, served by workload-a2a, no chassis dependency, no key"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph",
  "langchain-openai",
  "langchain-core",
  "openai",
  "mcp",
  "httpx2",
  "workload-a2a[otel]",
  "openinference-instrumentation-langchain>=0.1.80",
]

[dependency-groups]
# `langchain-mcp-adapters` is locked for one test only, the watch in
# `tests/test_langgraph_handle.py`; product code never imports it (ADR-006).
dev = ["fake-model-server", "fastmcp", "langchain-mcp-adapters"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "echo_langgraph"

[tool.uv.sources]
workload-a2a = { workspace = true }
