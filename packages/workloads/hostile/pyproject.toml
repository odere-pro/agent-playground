[project]
name = "hostile"
version = "0.1.0"
description = "The probe workload for the PoC-5 hostile suites: one fixed check per threat-model id, standard library only, on the workload-a2a template; never imports the chassis"
requires-python = ">=3.12,<3.13"
dependencies = ["workload-a2a"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hostile"
