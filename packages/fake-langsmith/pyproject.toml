[project]
name = "fake-langsmith"
version = "0.1.0"
description = "A fake of the LangSmith OTLP trace route (CH-10) and dataset routes (CH-12), in process for offline tests; never imported by the chassis"
requires-python = ">=3.12,<3.13"
dependencies = ["starlette>=0.40", "opentelemetry-proto>=1.45"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fake_langsmith"
