[project]
name = "fake-langfuse"
version = "0.1.0"
description = "A fake of the Langfuse public API routes the chassis uses (scores, OTLP traces), in process for offline tests; never imported by the chassis (PoC-7)"
requires-python = ">=3.12,<3.13"
dependencies = ["starlette>=0.40"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fake_langfuse"
