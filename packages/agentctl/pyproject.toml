[project]
name = "agentctl"
version = "0.1.0"
description = "PoC-9 agent factory CLI: agentctl new renders the service template with Copier; no chassis dependency"
requires-python = ">=3.12,<3.13"
# Pinned exactly, as the root dev group: a template render must not float. Bump on purpose.
dependencies = ["copier==9.19.1"]

[project.scripts]
agentctl = "agentctl.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentctl"

[dependency-groups]
# The rendered agents' own tests run in the monorepo venv (test_agentctl_rendered_checks.py), so it
# needs every framework the template offers. `langchain` (create_agent) is the one no workload
# brings; pinned exactly, as the template pins it (langchain-core stays at the template's pin).
dev = ["langchain==1.4.3"]
